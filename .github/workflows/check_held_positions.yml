name: Daily held-position check (read-only)

# ⚠️ DORMANT UNTIL 2026-09-29, same date guard as the weekly roster.
#
# Narrow and current, where the roster is wide and frozen. It asks one question
# about the names actually held: has any of them stopped trading, or filed to
# leave its exchange. Twenty names, seconds.
#
# READ-ONLY. It places no order, cancels nothing, and writes no research input.
# It has no broker-trading import at all.

on:
  workflow_dispatch:
  schedule:
    # Weekdays 21:30 UTC, after the US close. Dormant until 2026-09-29.
    - cron: '30 21 * * 1-5'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: NO-TOUCH WINDOW GUARD
        id: guard
        run: |
          set -u
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$TODAY" \< "2026-09-29" ]; then
            echo "no-touch window is open until 2026-09-29 (today $TODAY) — doing nothing"
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "no-touch window closed — proceeding"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'yes'
        with:
          python-version: '3.11'
      - name: Install deps
        if: steps.guard.outputs.run == 'yes'
        run: pip install "numpy<2.4" pandas requests
      - name: Check held positions
        if: steps.guard.outputs.run == 'yes'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python check_held_positions.py
      - name: Guard — nothing written
        if: steps.guard.outputs.run == 'yes'
        run: |
          set -u
          if ! git diff --quiet; then
            echo "::error::the daily check wrote something — it must be read-only"; exit 1
          fi
          echo "OK — read-only."

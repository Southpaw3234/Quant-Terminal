name: Position Trim (one-off remediation)

# Remediation tool for the duplicate-retrain leverage (Drive-sync stale-marker
# bug, fixed in 497f277 — see HANDOFF.md ledger 2026-07-06). The dup batches
# levered the paper account to ~2.9x gross; this pro-rata sells long equities
# back to ~1.0x (crypto untouched, model's queued exits netted out).
# dry-run (default) only REPORTS the plan; execute submits the sells.
# Manual dispatch only — never scheduled.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = report only; execute = cancel + sell'
        required: true
        default: 'dry-run'
        type: choice
        options: [dry-run, execute]
      target_ratio:
        description: 'target gross/equity ratio (share rounding lands ~0.05-0.07 above this)'
        required: false
        default: '1.0'
      sleeve:
        description: 'equity/crypto = pro-rata sell that sleeve; short-cover = BUY-to-cover all shorts exactly (target_ratio ignored)'
        required: false
        default: 'equity'
        type: choice
        options: [equity, crypto, short-cover]

permissions:
  contents: read

# Same group as the trading workflow so a trim never runs mid-cycle.
concurrency:
  group: quant-terminal
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile and trim
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:   'https://paper-api.alpaca.markets'
          TRIM_MODE:         ${{ github.event.inputs.mode }}
          TRIM_TARGET_RATIO: ${{ github.event.inputs.target_ratio || '1.0' }}
          TRIM_SLEEVE:       ${{ github.event.inputs.sleeve || 'equity' }}
        run: python delever_account.py

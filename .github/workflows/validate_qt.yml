name: Validate qt package (v28 Phase 0, read-only)

# Hermetic: no network, no secrets, no broker. The qt package is the
# replacement for quant_runner.py, but in Phase 0 it runs ONLY here --
# nothing imports it from the live pipeline.
#
# v28 SEQUENCING: not scheduled, not wired into quant_daily.yml, writes
# nothing under data/. S4 reads obs #30 on 2026-09-28 and the crons retire
# 09-29; until then quant_runner.py remains the production path, untouched.
# See docs/V28_AGENT_ARCHITECTURE.md §④.

on:
  workflow_dispatch:
  push:
    branches:
      - 'v27/**'
      - 'v28/**'
      # v29 added when the value programme opened. The commit that ADDED
      # validate_qt_scoring.py to this workflow could not run it, because the
      # branch it landed on was not listed. Same failure class as the paths
      # filter documented below: a trigger that lags the tests it guards
      # reports on a snapshot of something it is not watching.
      - 'v29/**'
      # docs/** added 2026-09-21 for the same reason v29/** was: the commit
      # that ADDED validate_protocols.py landed on docs/carry-forward and
      # triggered nothing. Third instance of this exact class in one file.
      - 'docs/**'
    paths:
      # Every input the suites actually read. The Phase 1 commit changed
      # validate_qt_phase1.py and data/registry/specifications.json and
      # triggered NOTHING, because neither was listed — a paths filter that
      # lags the tests it guards is a workflow that reports on a stale
      # snapshot of the thing it is supposed to be watching.
      - 'qt/**'
      - 'validate_qt.py'
      - 'validate_qt_phase1.py'
      - 'validate_qt_prices.py'
      - 'validate_qt_wrc.py'
      - 'validate_qt_scoring.py'
      - 'validate_qt_calendar_time.py'
      - 'validate_qt_liquidity.py'
      - 'validate_qt_execution.py'
      - 'validate_qt_roster_update.py'
      - 'validate_protocols.py'
      # CLAUDE.md is an INPUT: test_tier3_protocol_file reads it and asserts
      # it declares each required rule. Omitting it would be the paths-filter
      # trap again — a suite whose input can change without re-running it.
      - 'CLAUDE.md'
      - 'update_roster.py'
      - 'check_held_positions.py'
      - 'event_study.py'
      - 'data/registry/**'
      - 'data/events/event_study.csv'
      - '.github/workflows/validate_qt.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the untouched-pipeline check below diffs against
          # origin/master. The first version used HEAD~1, which does not exist
          # under checkout's default depth of 1 -- git errored, the `!` in the
          # test inverted the error into "modified", and the guard reported a
          # violation on every file on a branch that had touched none of them.
          # A guard that fails loudly on its own bug is the right failure
          # direction, but it was still crying wolf.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # pandas only. The qt package must not acquire a dependency on the
        # broker SDK, yfinance, or anything else that could reach the network
        # from a guard. A guard that can make a request can hang.
        run: pip install "numpy<2.4" pandas

      - name: Compile check
        run: |
          python -m py_compile qt/__init__.py qt/ledger.py qt/guards.py \
            qt/measurement.py qt/referee.py qt/prices.py qt/wrc.py \
            qt/scoring.py qt/calendar_time.py qt/liquidity.py \
            qt/execution.py qt/reconcile.py qt/roster_update.py
          python -m py_compile validate_qt.py validate_qt_phase1.py \
            validate_qt_prices.py validate_qt_wrc.py validate_qt_scoring.py \
            validate_qt_calendar_time.py validate_qt_liquidity.py \
            validate_qt_execution.py validate_qt_roster_update.py \
            validate_protocols.py
          python -m py_compile update_roster.py check_held_positions.py

      - name: Run Phase 0 validation
        run: python validate_qt.py

      - name: Run Phase 1 validation (incl. the E1 reproduction gate)
        run: python validate_qt_phase1.py

      - name: Run price-layer validation (back-adjustment semantics)
        run: python validate_qt_prices.py

      - name: Run WRC/SPA validation (the data-snooping demonstration)
        run: python validate_qt_wrc.py

      - name: Run scoring validation (V29 value + risk tiers)
        run: python validate_qt_scoring.py

      - name: Run calendar-time validation (V29 measurement)
        run: python validate_qt_calendar_time.py

      - name: Run liquidity validation (the spread estimator)
        run: python validate_qt_liquidity.py

      - name: Run execution + reconciliation validation
        run: python validate_qt_execution.py

      - name: Run roster-update validation (append-only merge)
        run: python validate_qt_roster_update.py

      # docs/CARRY_FORWARD.md §⑧. Tiers 2 and 3 were prose until this suite
      # existed, and prose is the arrangement qt/referee.py was built to
      # replace. Stdlib only, so it runs before any dependency is installed.
      - name: Run protocol validation (Tier 1 construction, Tier 2 wiring, Tier 3 discipline)
        run: python validate_protocols.py

      # ⚠️ INVERTED 2026-11-08. This step used to assert that quant_runner.py,
      # trading_model_v25.1.ipynb and quant_daily.yml were UNCHANGED, because
      # Phase 0 ran alongside a live pipeline it must not perturb. Its own
      # error text carried the expiry: "it must not before 2026-09-29". The
      # crons retired on that date, the final reads landed, and
      # docs/CARRY_FORWARD.md §⑤ says to leave the monolith behind.
      #
      # So the assertion flips rather than disappears. It used to protect the
      # pipeline from qt/; it now protects the repository from the pipeline
      # coming back. A deletion that nothing enforces is a deletion that gets
      # quietly reverted by a merge, and then qt/ is entangled again.
      - name: Assert the retired pipeline stays retired
        run: |
          set -u
          GONE=0
          for f in quant_runner.py \
                   trading_model_v22.ipynb trading_model_v23.ipynb \
                   trading_model_v23.1.ipynb trading_model_v23.2.ipynb \
                   trading_model_v23.3.ipynb trading_model_v23.4.ipynb \
                   trading_model_v25.1.ipynb \
                   model_intraday.py stat_arb.py shadow_stat_arb.py \
                   analyze_rank_ic.py analyze_shadow_intraday.py \
                   analyze_stat_arb.py \
                   .github/workflows/quant_daily.yml \
                   .github/workflows/preflight.yml; do
            if [ -e "$f" ]; then
              echo "::error::$f is back. docs/CARRY_FORWARD.md §⑤ retires it: the"
              echo "::error::279-name / 5-day-horizon / daily-rebalance frame is"
              echo "::error::measured and closed, and qt/ already replaced what was"
              echo "::error::worth keeping."
              GONE=1
            fi
          done
          if ls probe_*.py >/dev/null 2>&1; then
            echo "::error::a probe_*.py is back — probes answered their question;"
            echo "::error::they are history, not tools (§⑤)"
            GONE=1
          fi
          [ "$GONE" -eq 0 ] || exit 1
          if ! git diff --quiet -- data/ 2>/dev/null; then
            echo "::error::validation wrote under data/ — it must not"
            exit 1
          fi
          echo "OK — the retired pipeline is absent and data/ is untouched."

      - name: Assert qt imports nothing it should not
        # A guard module that can import the broker SDK is one refactor away
        # from a guard that places an order.
        run: |
          set -u
          if grep -rnE '^\s*(import|from)\s+(alpaca|yfinance|requests)' qt/; then
            echo "::error::qt/ imports a network or broker library"
            exit 1
          fi
          echo "OK — qt/ has no network or broker imports."

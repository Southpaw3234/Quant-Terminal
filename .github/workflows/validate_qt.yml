name: Validate qt package (v28 Phase 0, read-only)

# Hermetic: no network, no secrets, no broker. The qt package is the
# replacement for quant_runner.py, but in Phase 0 it runs ONLY here --
# nothing imports it from the live pipeline.
#
# v28 SEQUENCING: not scheduled, not wired into quant_daily.yml, writes
# nothing under data/. S4 reads obs #30 on 2026-09-28 and the crons retire
# 09-29; until then quant_runner.py remains the production path, untouched.
# See docs/V28_AGENT_ARCHITECTURE.md §④.

on:
  workflow_dispatch:
  push:
    branches:
      - 'v28/**'
    paths:
      - 'qt/**'
      - 'validate_qt.py'
      - '.github/workflows/validate_qt.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # pandas only. The qt package must not acquire a dependency on the
        # broker SDK, yfinance, or anything else that could reach the network
        # from a guard. A guard that can make a request can hang.
        run: pip install "numpy<2.4" pandas

      - name: Compile check
        run: |
          python -m py_compile qt/__init__.py qt/ledger.py qt/guards.py
          python -m py_compile validate_qt.py

      - name: Run Phase 0 validation
        run: python validate_qt.py

      - name: Assert the live pipeline is untouched
        run: |
          set -u
          for f in quant_runner.py trading_model_v25.1.ipynb \
                   .github/workflows/quant_daily.yml; do
            if ! git diff --quiet HEAD~1 -- "$f" 2>/dev/null; then
              echo "::error::Phase 0 modified $f — it must not before 2026-09-29"
              exit 1
            fi
          done
          if ! git diff --quiet -- data/ 2>/dev/null; then
            echo "::error::validation wrote under data/ — it must not"
            exit 1
          fi
          echo "OK — monolith, notebook, live workflow and data/ all untouched."

      - name: Assert qt imports nothing it should not
        # A guard module that can import the broker SDK is one refactor away
        # from a guard that places an order.
        run: |
          set -u
          if grep -rnE '^\s*(import|from)\s+(alpaca|yfinance|requests)' qt/; then
            echo "::error::qt/ imports a network or broker library"
            exit 1
          fi
          echo "OK — qt/ has no network or broker imports."

name: Weekly roster update (incremental, append-only)

# 🛑 SCHEDULE RETIRED 2026-11-08, BY OPERATOR DECISION. Dispatch only.
#
# The date guard below is INVERTED relative to the trading crons. Before
# 2026-09-29 a firing was a no-op; on and after it, this job began committing
# to master every Sunday with nothing in the repo to ever stop it. It ran for
# real five times — 10-04, 10-11, 10-18, 10-25, 11-01 — and would have gone on
# weekly, indefinitely, maintaining a roster that no surviving reader consumes.
#
# The alpha search closed 2026-08-09 and the v25 crons retired 2026-09-29. If a
# future v27 or V29 specification needs a refreshed roster, dispatch this by
# hand and commit the result deliberately, which is what a research input
# deserves anyway.
#
# TO RESTORE THE CRON: uncomment the block below AND give the guard an upper
# bound as well as a lower one. A guard with only a start date is how this
# happened.
#
# The original note, kept because it is the reasoning that was overtaken:
#   "A cron that fires and immediately exits is still, on a strict reading,
#   running on a cron. It writes nothing and touches nothing, which is what
#   the rule protects. If you want the stricter reading, comment out the
#   schedule block and add it back on 2026-09-29 — the date guard stays
#   either way as the belt to that braces."
# That reading was correct for the pre-sunset window and wrong for the one
# after it, because the guard opens rather than closes.
#
# WHY WEEKLY AND NOT HOURLY: a handful of Form 25 filings arrive per trading
# day across the whole market, and a delisting matters to a quarterly-rebalanced
# value model over months. Hourly buys nothing daily does not, and daily buys
# little weekly does not. The genuinely time-sensitive question — has something
# I OWN stopped trading — is a different job: check_held_positions.yml.

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Also write a dated, immutable snapshot for a specification to name'
        type: boolean
        default: false
  # schedule:
  #   # Sundays 06:00 UTC. See the retirement note at the top of this file.
  #   - cron: '0 6 * * 0'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: NO-TOUCH WINDOW GUARD
        id: guard
        run: |
          set -u
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$TODAY" \< "2026-09-29" ]; then
            echo "no-touch window is open until 2026-09-29 (today $TODAY) — doing nothing"
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "no-touch window closed — proceeding"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'yes'
        with:
          python-version: '3.11'
      - name: Install deps
        if: steps.guard.outputs.run == 'yes'
        run: pip install "numpy<2.4" pandas requests
      - name: Update the roster
        if: steps.guard.outputs.run == 'yes'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          QT_ROSTER_SNAPSHOT: ${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot) && '1' || '0' }}
        run: python update_roster.py
      - name: Guard — only the roster may have changed
        if: steps.guard.outputs.run == 'yes'
        run: |
          set -u
          if ! git diff --quiet -- . ':(exclude)data/universe/delisted_roster_2015*.csv'; then
            echo "::error::the weekly update touched something other than the roster"
            git --no-pager diff --stat
            exit 1
          fi
          echo "OK — nothing outside the roster changed."
      - name: Commit if anything was added
        if: steps.guard.outputs.run == 'yes'
        run: |
          set -u
          if git diff --quiet -- data/universe/; then
            echo "no change this week — nothing to commit, which is the expected outcome"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universe/delisted_roster_2015*.csv
          git commit -m "data(v29): weekly roster update [skip ci]"
          git push

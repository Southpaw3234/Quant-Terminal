name: Collective agent — daily pipeline

# The four agents of docs/COLLECTIVE_AGENT_BRIEF.md, run in order, once.
#
#   OBSERVER   filings + macro/news   -> observations/, macro/
#   LIBRARIAN  filing language        -> briefs/
#   ACTUARY    base rates, exposure   -> analysis/
#   CHIEF      the daily brief        -> chief/   -> Discord, the dashboard,
#                                                   a reply on each message
#
# This file is still called observer.yml. It began as OBSERVER alone and
# keeps the name so it can be dispatched from a branch before it is merged
# (GitHub only offers workflow_dispatch for a workflow that already exists
# on the default branch).
#
# 🔑 ONE WORKFLOW, NOT FOUR ON OFFSET CRONS. The first design scheduled
# OBSERVER at 23:10 and LIBRARIAN at 23:40 and called that "after". GitHub's
# scheduler is best-effort: the 22:05 daily snapshot has been starting
# between 02:14 and 02:50. Two crons thirty minutes apart are not ordered,
# they are merely usually ordered, and on the night they are not the
# LIBRARIAN reads yesterday's observations and says nothing about it. Here
# the order is a property of the file.
#
# 🔑 A STAGE THAT FAILS DOES NOT STOP THE ONES AFTER IT. Each agent step is
# continue-on-error, so a dead OBSERVER still yields a brief -- one whose
# first block says OBSERVER is dark. The publish and delivery steps run
# regardless, and the LAST step turns the run red if any stage failed. So:
# whatever was produced is delivered, and a failure is never green.
#
# 🔑 NO AGENT WRITES data/. The registry, the frozen ledgers, the thesis
# ledger, the phrase list, the stance and the positions are inputs. The
# guard step asserts `git diff --quiet -- data/` after every agent has run.

on:
  schedule:
    # 23:10 UTC on weekdays — after the US close and after EDGAR's 22:00 UTC
    # acceptance cut-off, so the day's filings are complete.
    - cron: '10 23 * * 1-5'
  workflow_dispatch:
    inputs:
      post:
        description: 'Deliver to Discord and reply to operator messages (off = dry run)'
        type: boolean
        default: true
      max_names:
        description: 'LIBRARIAN issuer cap (open-thesis names are never dropped)'
        type: string
        default: '60'
  push:
    branches: ['master', 'v27/**', 'v28/**', 'v29/**', 'agent/**',
               'ci/**']
    paths:
      - 'observer_filings.py'
      - 'observer_macro.py'
      - 'librarian_diff.py'
      - 'actuary.py'
      - 'chief_of_staff.py'
      - 'observer_prices.py'
      - 'qt/volatility.py'
      - 'validate_volatility.py'
      - 'research/volatility_eval.py'
      - 'extract_form4.py'
      - 'qt/edgar.py'
      - 'qt/agentio.py'
      - 'qt/notify.py'
      - 'qt/librarian.py'
      - 'qt/actuary.py'
      - 'qt/chief.py'
      - 'qt/thesis.py'
      - 'validate_observer_filings.py'
      - 'validate_observer_macro.py'
      - 'validate_librarian_diff.py'
      - 'validate_actuary.py'
      - 'validate_chief_of_staff.py'
      - 'validate_described_events.py'
      - 'research/extract_described_events.py'
      - 'research/describe_events.py'
      - 'data/registry/described.json'
      - 'data/events/**'
      - 'data/librarian/phrases.json'
      - 'data/actuary/sources.json'
      - 'data/operator/**'
      - '.github/scripts/publish_agent_branch.sh'
      - '.github/workflows/observer.yml'

permissions:
  contents: read

concurrency:
  group: collective-agent
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  # 🔑 NOT `agent`. Git stores a branch as a path, so a branch named `agent`
  # cannot exist while branches named `agent/<anything>` do -- and this
  # repository's working branches are `agent/**`. The first live run built a
  # complete brief and then failed to publish it:
  #     fatal: cannot lock ref 'HEAD': 'refs/heads/agent/collective' exists;
  #     cannot create 'refs/heads/agent'
  # The throwaway remote the publish script was tested against had no
  # `agent/*` branches, so the test passed. It now includes one.
  AGENT_BRANCH: agent-output

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No requests. Every agent imports it lazily, inside the function that
      # opens a session, so these suites cannot reach a network even by
      # accident -- which is what makes "hermetic" a demonstrated property.
      # arch is the GARCH library; scipy comes with it. Still no requests:
      # these suites cannot reach a network.
      - name: Install deps
        run: pip install "numpy<2.4" pandas arch
      - name: Compile check
        run: |
          for f in observer_filings observer_macro librarian_diff actuary \
                   chief_of_staff qt/edgar qt/agentio qt/notify qt/librarian \
                   qt/actuary qt/chief qt/thesis qt/volatility observer_prices \
                   validate_observer_filings validate_observer_macro \
                   validate_librarian_diff validate_actuary \
                   validate_chief_of_staff validate_described_events \n                   research/extract_described_events research/describe_events; do
            python -m py_compile "$f.py"
          done
          bash -n .github/scripts/publish_agent_branch.sh
      - name: OBSERVER — filings
        run: python validate_observer_filings.py
      - name: OBSERVER — macro and news
        run: python validate_observer_macro.py
      - name: LIBRARIAN
        run: python validate_librarian_diff.py
      - name: ACTUARY
        run: python validate_actuary.py
      - name: Volatility model
        run: python validate_volatility.py
      - name: CHIEF OF STAFF
        run: python validate_chief_of_staff.py
      - name: Described base rates
        run: python validate_described_events.py

      - name: The declared phrase list parses, and record its digest
        # A brief carries this digest, so a later edit to the list is visible
        # against briefs already published.
        run: |
          set -u
          python - <<'PY'
          from qt import librarian as lib
          p = lib.parse_phrases(open("data/librarian/phrases.json", "rb").read())
          print(f"{len(p['phrases'])} phrase(s) declared — digest {p['digest']}")
          for ph in p["phrases"]:
              assert ph["why"], f"{ph['text']!r} has no stated reason"
              print(f"  {ph['declared_at']}  {ph['text']}")
          PY

      - name: The publish script survives the failure that broke production
        # Night one creates the branch. Night two finds it already there AND
        # finds untracked copies of its files in the working tree -- the
        # exact state that made `git checkout` refuse for three nights. Then
        # a shrunken day file must be refused with the remote unchanged.
        run: |
          set -euo pipefail
          SCRIPT="$PWD/.github/scripts/publish_agent_branch.sh"
          T="$(mktemp -d)"; cd "$T"
          git init -q --bare remote.git
          git clone -q remote.git work 2>/dev/null; cd work
          git config user.email t@t; git config user.name t
          echo hi > README.md; git add .; git commit -qm init
          git push -q origin HEAD:master

          # The real repository has working branches named agent/<x>. The
          # first version of this test did not, which is why it passed while
          # the real publish could not create a branch called `agent`.
          git push -q origin HEAD:refs/heads/agent/some-working-branch
          B="$AGENT_BRANCH"

          mkdir -p observations chief
          printf '{"id":1}\n{"id":2}\n' > observations/2026-11-10.jsonl
          echo '{}' > observations/cik_cache.json
          bash "$SCRIPT" "$B" observations macro chief
          printf '{"id":1}\n{"id":2}\n{"id":3}\n' > observations/2026-11-10.jsonl
          echo '{"c":1}' > observations/cik_cache.json
          bash "$SCRIPT" "$B" observations macro chief
          git fetch -q origin "$B"
          [ "$(git show FETCH_HEAD:observations/2026-11-10.jsonl | wc -l)" -eq 3 ] \
            || { echo "::error::night two did not publish"; exit 1; }
          [ "$(git rev-list --count FETCH_HEAD)" -eq 2 ] \
            || { echo "::error::history was not appended to"; exit 1; }

          printf '{"id":1}\n' > observations/2026-11-10.jsonl
          if bash "$SCRIPT" "$B" observations macro chief; then
            echo "::error::a shrunken day file was published"; exit 1
          fi
          git fetch -q origin "$B"
          [ "$(git show FETCH_HEAD:observations/2026-11-10.jsonl | wc -l)" -eq 3 ] \
            || { echo "::error::a refused publish changed the branch"; exit 1; }

          # A name that collides with the agent/<x> namespace must be refused
          # up front, by name, not discovered as a git lock error at the end
          # of a twenty-minute run.
          printf '{"id":1}\n{"id":2}\n{"id":3}\n' > observations/2026-11-10.jsonl
          if bash "$SCRIPT" agent observations macro chief 2> /tmp/collide.txt; then
            echo "::error::a colliding branch name was accepted"; exit 1
          fi
          grep -q "collides" /tmp/collide.txt \
            || { echo "::error::the collision was not named"; cat /tmp/collide.txt; exit 1; }
          echo "OK — appends, survives untracked files, refuses a shrink, names a ref collision."

      - name: Assert nothing under data/ changed
        run: |
          set -u
          if ! git diff --quiet -- data/ 2>/dev/null; then
            echo "::error::validation modified data/ — it must be read-only"
            git --no-pager diff --stat -- data/
            exit 1
          fi
          echo "OK — data/ untouched."

  pipeline:
    needs: validate
    # Unreachable from a push: only the cron or an explicit dispatch runs it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write        # only ever to the agent-output branch
      issues: write          # to reply on the operator's own messages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install "numpy<2.4" pandas requests yfinance arch

      - name: Restore what was published, and fetch today's universe
        # The agents append to what is already on the branch, so it has to
        # be on disk first. `git archive | tar` writes plain files and never
        # checks a branch out -- the working tree stays on this commit.
        run: |
          set -u
          restore() {   # restore <ref> <dir>
            git archive "$1" "$2" 2>/dev/null | tar -x 2>/dev/null \
              && echo "restored $2 from $1" || echo "no $2 on $1 yet"
          }
          if git ls-remote --exit-code --heads origin "$AGENT_BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$AGENT_BRANCH"
            for d in observations macro briefs analysis chief; do restore FETCH_HEAD "$d"; done
          elif git ls-remote --exit-code --heads origin observations >/dev/null 2>&1; then
            # First run of the pipeline: carry over what OBSERVER published
            # on its own branch, including the warm CIK cache.
            git fetch -q origin observations
            restore FETCH_HEAD observations
          else
            echo "nothing published yet — a cold start"
          fi
          curl -fsSL -o daily.json \
            "https://raw.githubusercontent.com/${{ github.repository }}/data/docs/daily.json" \
            && echo "universe: the daily snapshot" \
            || { rm -f daily.json; echo "no snapshot — OBSERVER falls back to the frozen panel (wider)"; }
          ls -1 observations 2>/dev/null | tail -5 || true

      - name: OBSERVER — filings
        id: observer
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          QT_OBS_UNIVERSE: daily.json
        run: python observer_filings.py

      - name: OBSERVER — macro and news
        id: macro
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python observer_macro.py

      - name: LIBRARIAN
        id: librarian
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          QT_LIB_MAX_NAMES: ${{ inputs.max_names || '60' }}
        run: python librarian_diff.py

      - name: OBSERVER — prices for the risk section
        id: prices
        continue-on-error: true
        run: python observer_prices.py

      - name: ACTUARY
        id: actuary
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python actuary.py

      - name: CHIEF OF STAFF — compose the brief
        id: chief
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QT_DAILY_JSON: daily.json
          QT_AGENT_BRANCH: ${{ env.AGENT_BRANCH }}
        run: python chief_of_staff.py

      - name: Guard — no agent wrote to data/
        id: guard
        run: |
          set -u
          if ! git diff --quiet -- data/ 2>/dev/null \
             || [ -n "$(git status --porcelain -- data/)" ]; then
            echo "::error::an agent modified data/ — registry, ledgers, phrase list, stance and positions are read-only inputs"
            git status --porcelain -- data/
            exit 1
          fi
          echo "OK — registry, frozen ledgers, thesis ledger and operator inputs untouched."

      - name: Summarise
        if: always()
        env:
          S_OBSERVER: ${{ steps.observer.outcome }}
          S_MACRO: ${{ steps.macro.outcome }}
          S_LIBRARIAN: ${{ steps.librarian.outcome }}
          S_PRICES: ${{ steps.prices.outcome }}
          S_ACTUARY: ${{ steps.actuary.outcome }}
          S_CHIEF: ${{ steps.chief.outcome }}
        run: |
          set -u
          {
            echo "### Collective agent — stages"
            echo "| stage | outcome |"
            echo "| --- | --- |"
            echo "| OBSERVER filings | $S_OBSERVER |"
            echo "| OBSERVER macro | $S_MACRO |"
            echo "| LIBRARIAN | $S_LIBRARIAN |"
            echo "| OBSERVER prices | $S_PRICES |"
            echo "| ACTUARY | $S_ACTUARY |"
            echo "| CHIEF OF STAFF | $S_CHIEF |"
            echo
            f="$(ls -1 chief/2*.md 2>/dev/null | tail -1 || true)"
            if [ -n "$f" ]; then cat "$f"; else echo "_no brief was written_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the agent-output branch
        id: publish
        if: always() && steps.guard.outcome == 'success'
        run: bash .github/scripts/publish_agent_branch.sh "$AGENT_BRANCH" observations macro briefs analysis chief

      - name: Deliver — Discord, and a reply on each operator message
        # After the publish, on purpose: both link to the brief on the
        # branch, and a link to a page that was never pushed is worse than
        # no message.
        if: always() && steps.publish.outcome == 'success' && steps.chief.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          QT_AGENT_BRANCH: ${{ env.AGENT_BRANCH }}
          QT_CHIEF_POST: ${{ (github.event_name == 'schedule' || inputs.post) && '1' || '0' }}
          QT_CHIEF_REPLY: ${{ (github.event_name == 'schedule' || inputs.post) && '1' || '0' }}
        run: python chief_of_staff.py --deliver

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collective-agent
          path: |
            observations/2*.jsonl
            observations/2*.md
            observations/2*.meta.json
            macro/
            briefs/
            analysis/
            chief/
          if-no-files-found: warn

      - name: Verdict — a failed stage is never a green run
        if: always()
        env:
          S_OBSERVER: ${{ steps.observer.outcome }}
          S_MACRO: ${{ steps.macro.outcome }}
          S_LIBRARIAN: ${{ steps.librarian.outcome }}
          S_ACTUARY: ${{ steps.actuary.outcome }}
          S_PRICES: ${{ steps.prices.outcome }}
          S_CHIEF: ${{ steps.chief.outcome }}
          S_GUARD: ${{ steps.guard.outcome }}
          S_PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -u
          bad=0
          for pair in "OBSERVER filings:$S_OBSERVER" "OBSERVER macro:$S_MACRO" \
                      "LIBRARIAN:$S_LIBRARIAN" "OBSERVER prices:$S_PRICES" \
                      "ACTUARY:$S_ACTUARY" \
                      "CHIEF OF STAFF:$S_CHIEF" "data/ guard:$S_GUARD" \
                      "publish:$S_PUBLISH"; do
            name="${pair%%:*}"; out="${pair##*:}"
            if [ "$out" != "success" ]; then
              echo "::error::$name — $out"
              bad=1
            else
              echo "ok   $name"
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "One or more stages did not succeed. Whatever was produced has been published and the brief names the dark inputs; this run is red so the failure is not mistaken for a quiet night."
            exit 1
          fi
          echo "All stages succeeded."

name: Validate event-study engine (v27 A2, read-only)

# Proves `event_study.py` against synthetic data with KNOWN answers before it
# is ever pointed at a real filing. Measurement-only:
#   * no trading keys, no broker, no orders
#   * no network at all -- prices come from a temp CSV, not yfinance
#   * nothing is committed, and nothing under data/predictions/ is touched
#
# v27 SEQUENCING: this workflow must NOT be added to quant_daily.yml and must
# not run on a schedule before 2026-09-29. S4 is mid-flight at N=12 and reads
# obs #30 on ~2026-09-28; anything writing to data/predictions/ or altering
# the live model before then corrupts a measurement four criteria depend on.
# This job is dispatch/branch-only by design. See docs/V27_BUILD_PLAN.md 0.

on:
  workflow_dispatch:
    inputs:
      run_count:
        description: 'COUNT ONLY — how many events settle at the current horizon? No returns, no budget'
        type: boolean
        default: false
      events_csv:
        description: 'Events file to count (default the frozen spec-1 set)'
        type: string
        default: 'data/events/events_form4.csv'
      spec_id:
        description: 'Registry spec_id to read (the Referee must have it DECLARED and UNREAD)'
        type: string
        default: 'form4_cluster_buy_v2'
      out_csv:
        description: 'Output ledger. NEVER event_study.csv for any spec but v1 -- it is v1 frozen'
        type: string
        default: 'data/events/event_study_v2.csv'
      e1_events_csv:
        # E1 ONLY. Deliberately separate from `events_csv` above: that one's
        # default is the count job's v1 file, so `inputs.events_csv || <1095d>`
        # was non-empty on every dispatch and the fallback never fired. That is
        # how the 2026-09-05 dispatch (run 33933992017) read the wrong spec.
        description: 'E1 ONLY: events file to READ. Default = spec #2 declared input.'
        type: string
        default: 'data/events/events_form4_1095d.csv'
      run_e1:
        description: "THE E1 READ — computes returns and SPENDS one of K=5"
        type: boolean
        default: false
  push:
    branches:
      - 'v27/**'
      - 'v28/**'
    paths:
      - 'event_study.py'
      - 'validate_event_study.py'
      - '.github/workflows/validate_event_study.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # Deliberately NOT installing yfinance: the suite must be hermetic,
        # and if a test can reach the network it will eventually fail for a
        # reason that has nothing to do with the code under test.
        run: pip install "numpy<2.4" pandas

      - name: Compile check
        run: |
          python -m py_compile event_study.py
          python -m py_compile validate_event_study.py

      - name: Run validation suite
        run: python validate_event_study.py

      - name: Assert the live pipeline was not touched
        # A validate job that quietly wrote into the S4 evidence tree would be
        # far worse than a failing test. Cheap to check, so check it.
        run: |
          set -u
          if ! git diff --quiet -- data/ 2>/dev/null; then
            echo "::error::validation modified data/ — it must be read-only"
            git --no-pager diff --stat -- data/
            exit 1
          fi
          echo "OK — data/ untouched by the validation run."

  e1:
    # ⚠️ THE E1 READ. This is the FIRST job in v27 that computes RETURNS, and
    # running it spends ONE of the K=5 specifications in
    # docs/V27_PREREGISTRATION.md. Everything before it -- universe size,
    # event counts, schema probes -- was availability and cost nothing.
    #
    # The specification being read is:
    #   universe   907 names, 250k <= ADV <= 5M, price >= $2, >=200 bars
    #   events     >= 2 distinct insiders within 5d, aggregate >= $100,000
    #   horizon    21 trading bars, entry first bar STRICTLY AFTER event_ts
    #   control    SPY, market-adjusted
    #
    # The output ledger freezes on first write, so this read cannot be
    # quietly re-run into a different number.
    if: github.event_name == 'workflow_dispatch' && inputs.run_e1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install "numpy<2.4" pandas "yfinance>=0.2.40,<2"
      - name: Run the event study
        env:
          QT_EVENTS_CSV: ${{ inputs.e1_events_csv || 'data/events/events_form4_1095d.csv' }}
          QT_EVENT_OUT: ${{ inputs.out_csv || 'data/events/event_study_v2.csv' }}
          # Horizon deliberately NOT pinned here: it follows event_study.py's
          # default, which docs/V27_FORK_DECISION.md moved to 63. A hardcoded
          # '21' would have silently run any future read at the retired horizon.
          QT_EVENT_BENCH: SPY
          QT_SPEC_ID: ${{ inputs.spec_id || 'form4_cluster_buy_v2' }}
        run: |
          set -u
          if [ ! -f "$QT_EVENTS_CSV" ]; then
            echo "::error::no events file — run the extractor first."
            exit 1
          fi
          # INPUT GUARD (added after the 2026-09-05 miswire). The registry already
          # names each spec's declared events_file; the job never asked it. A job
          # that loads a file the registry did not name is not reading the declared
          # specification, whatever the Referee authorised. Refuse, before a price
          # downloads.
          DECLARED=$(python - <<'PY'
          import json, os
          r = json.load(open("data/registry/specifications.json"))
          s = r["specifications"].get(os.environ["QT_SPEC_ID"], {})
          print((s.get("params", {}).get("events_file", "") or "").split(" ")[0])
          PY
          )
          if [ -n "$DECLARED" ] && [ "$DECLARED" != "$QT_EVENTS_CSV" ]; then
            echo "::error::spec $QT_SPEC_ID declares events_file=$DECLARED but this job was about to read $QT_EVENTS_CSV — refusing (the 2026-09-05 miswire)"
            exit 5
          fi
          echo "input guard OK: $QT_EVENTS_CSV matches the registry's declared events_file"
          # OUTPUT GUARD, the mirror of the input guard above. The registry names
          # each spec's declared output_ledger; this job never asked it, and the
          # only protection was the hardcoded v1 check below -- which names ONE
          # file. Dispatching spec #3 while leaving out_csv at its default
          # (event_study_v2.csv) passed every check and would have written into
          # spec #2's frozen ledger.
          #
          # 🔑 THAT WOULD NOT HAVE FAILED LOUDLY. qt.ledger.freeze_first_write
          # protects rows ALREADY written and APPENDS new ones, so the result is
          # not a crash and not an overwrite: it is two specifications silently
          # mixed in one file, discoverable only by noticing the row count moved.
          DECLARED_OUT=$(python - <<'PY'
          import json, os
          r = json.load(open("data/registry/specifications.json"))
          s = r["specifications"].get(os.environ["QT_SPEC_ID"], {})
          print((s.get("params", {}).get("output_ledger", "") or "").split(" ")[0])
          PY
          )
          if [ -n "$DECLARED_OUT" ] && [ "$DECLARED_OUT" != "$QT_EVENT_OUT" ]; then
            echo "::error::spec $QT_SPEC_ID declares output_ledger=$DECLARED_OUT but this job was about to write $QT_EVENT_OUT — refusing. A frozen ledger APPENDS, so this would mix two specifications in one file."
            exit 6
          fi
          if [ -n "$DECLARED_OUT" ]; then
            echo "output guard OK: $QT_EVENT_OUT matches the registry's declared output_ledger"
          else
            echo "output guard: spec $QT_SPEC_ID declares no output_ledger — falling through to the v1 check below"
          fi
          # HARD GUARD: v1's ledger is frozen evidence. The freeze would keep v1's
          # rows and APPEND another spec's -- two specifications silently mixed in
          # one file. Refuse before a single price downloads.
          #
          # KEPT, not replaced: form4_cluster_buy_v1 was declared before the
          # registry carried an output_ledger field, so DECLARED_OUT is empty for
          # it and the guard above cannot fire. Backfilling that field would mean
          # hand-editing the params of an already-READ specification, which is
          # exactly the edit the registry's own note forbids. So v1 keeps its
          # hardcoded guard and the two together cover every spec.
          if [ "$QT_EVENT_OUT" = "data/events/event_study.csv" ] && [ "$QT_SPEC_ID" != "form4_cluster_buy_v1" ]; then
            echo "::error::refusing to write spec $QT_SPEC_ID into v1's frozen ledger"; exit 4
          fi
          echo "spec=$QT_SPEC_ID events=$QT_EVENTS_CSV ($(( $(wc -l < "$QT_EVENTS_CSV") - 1 )) rows) out=$QT_EVENT_OUT"
          python event_study.py
      - name: Guard — S4 evidence untouched
        run: |
          set -u
          if ! git diff --quiet -- data/predictions/ data/shadow/ 2>/dev/null; then
            echo "::error::the event study modified S4 evidence — it must not"
            exit 1
          fi
          echo "OK — data/predictions/ and data/shadow/ untouched."
      - uses: actions/upload-artifact@v4
        with:
          name: v27-e1-read
          path: data/events/event_study*.csv
          if-no-files-found: error

  count:
    # Availability only. Dedup + settlement classification at the current
    # horizon, NO returns computed, nothing written, Referee not consulted.
    # Answers docs/V27_FORK_DECISION.md §⑥ item 2 for free.
    if: github.event_name == 'workflow_dispatch' && inputs.run_count
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install "numpy<2.4" pandas "yfinance>=0.2.40,<2"
      - name: Count settled events (no returns)
        env:
          QT_EVENTS_CSV: ${{ inputs.events_csv || 'data/events/events_form4.csv' }}
          QT_EVENT_COUNT_ONLY: '1'
          QT_EVENT_OUT: /tmp/never-written.csv
        run: |
          set -u
          echo "events file: $QT_EVENTS_CSV ($(( $(wc -l < "$QT_EVENTS_CSV") - 1 )) rows)"
          python event_study.py
      - name: Guard — nothing written anywhere
        run: |
          set -u
          if [ -f /tmp/never-written.csv ]; then
            echo "::error::count-only mode wrote a ledger — it must not"; exit 1
          fi
          if ! git diff --quiet -- data/; then
            echo "::error::count-only mode modified data/"; exit 1
          fi
          echo "OK — nothing written, budget untouched."

name: Preflight Diagnostics

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        # No explicit ref: check out whatever branch the workflow is dispatched
        # on, so preflight validates the actual code under review (was pinned to
        # a stale branch, which silently tested the wrong commit).

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps (subset — no trading keys needed)
        run: |
          pip install --upgrade pip
          pip install numpy pandas yfinance statsmodels requests xgboost lightgbm scikit-learn

      - name: 1 — Syntax check (py_compile)
        run: |
          python -m py_compile quant_runner.py  && echo "quant_runner.py  PASS"
          python -m py_compile stat_arb.py       && echo "stat_arb.py       PASS"
          python -m py_compile shadow_stat_arb.py && echo "shadow_stat_arb.py PASS"
          python -m py_compile fill_audit.py     && echo "fill_audit.py     PASS"
          python -m py_compile analyze_stat_arb.py && echo "analyze_stat_arb.py PASS"
          python -m py_compile shadow_intraday.py && echo "shadow_intraday.py PASS"
          python -m py_compile analyze_shadow_intraday.py && echo "analyze_shadow_intraday.py PASS"
          python -m py_compile model_intraday.py && echo "model_intraday.py PASS"
          python -m py_compile backfill_intraday_features.py && echo "backfill_intraday_features.py PASS"

      - name: 2 — AST parse + triple-quote balance
        run: |
          python - <<'PYEOF'
          import ast, sys
          files = ["quant_runner.py", "stat_arb.py", "shadow_stat_arb.py", "fill_audit.py",
                   "analyze_stat_arb.py", "shadow_intraday.py", "analyze_shadow_intraday.py",
                   "model_intraday.py", "backfill_intraday_features.py"]
          ok = True
          for f in files:
              src = open(f, encoding="utf-8-sig").read()
              try:
                  ast.parse(src)
                  print(f"  AST OK   : {f}")
              except SyntaxError as e:
                  print(f"  AST FAIL : {f}  line={e.lineno}  {e.msg}")
                  ok = False
          sys.exit(0 if ok else 1)
          PYEOF

      - name: 3 — Patch string extraction + exec test
        run: |
          python - <<'PYEOF'
          import ast, re, sys, traceback

          src = open("quant_runner.py", encoding="utf-8-sig").read()
          tree = ast.parse(src)

          # Find all variables named CELL_*PATCH or _CELL_*
          patch_vars = {}
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name):
                          name = target.id
                          if re.match(r"(CELL_\d+_(PRE|POST)PATCH|_CELL_\d+_\w+)$", name):
                              if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                                  patch_vars[name] = node.value.value

          print(f"  Found {len(patch_vars)} patch strings via AST")

          ok = True
          for name, code in patch_vars.items():
              try:
                  ast.parse(code)
              except SyntaxError as e:
                  print(f"  SYNTAX FAIL in {name}: line={e.lineno} {e.msg}")
                  print(f"    context: {code.splitlines()[max(0,e.lineno-2):e.lineno+1]}")
                  ok = False

          if ok:
              print(f"  All {len(patch_vars)} patch strings parse cleanly ✓")
          sys.exit(0 if ok else 1)
          PYEOF

      - name: 4 — Dispatcher dict completeness
        run: |
          python - <<'PYEOF'
          import ast, re, sys

          src = open("quant_runner.py", encoding="utf-8-sig").read()
          pre_match  = re.search(r"_CELL_PREPATCH\s*=\s*\{([^}]+)\}", src, re.S)
          post_match = re.search(r"_CELL_POSTPATCH\s*=\s*\{([^}]+)\}", src, re.S)

          def extract_keys(block):
              return [int(m) for m in re.findall(r"(\d+)\s*:", block)]

          pre_keys  = extract_keys(pre_match.group(1))  if pre_match  else []
          post_keys = extract_keys(post_match.group(1)) if post_match else []

          print(f"  PREPATCH  cells: {sorted(pre_keys)}")
          print(f"  POSTPATCH cells: {sorted(post_keys)}")

          expected_pre  = [3, 4, 5, 6, 8, 9, 10, 11, 12, 13, 14, 15]
          expected_post = [4, 5, 6, 8, 9, 10, 11, 12, 13, 15]

          ok = True
          if sorted(pre_keys) != sorted(expected_pre):
              print(f"  WARN PREPATCH mismatch: got={sorted(pre_keys)} want={expected_pre}")
              ok = False
          if sorted(post_keys) != sorted(expected_post):
              print(f"  WARN POSTPATCH mismatch: got={sorted(post_keys)} want={expected_post}")
              ok = False
          if ok:
              print("  Dispatcher dicts complete ✓")
          sys.exit(0 if ok else 1)
          PYEOF

      - name: 5 — Append (+=) chain count
        run: |
          python - <<'PYEOF'
          import re, sys
          src = open("quant_runner.py", encoding="utf-8-sig").read()
          # Count lines matching: CELL_N_(PRE|POST)PATCH += ...
          appends = re.findall(r"^CELL_\d+_(PRE|POST)PATCH\s*\+=", src, re.M)
          print(f"  Patch append (+=) count: {len(appends)}")
          # Known minimum: 12 original + 2 new (Cell8 FitWiring + Cell13 Kelly postpatch is inline)
          if len(appends) < 12:
              print(f"  FAIL: expected >=12 appends, got {len(appends)}")
              sys.exit(1)
          print("  Append chain OK ✓")
          PYEOF

      - name: 6 — Key function signatures in stat_arb.py
        run: |
          python - <<'PYEOF'
          import ast, sys
          src = open("stat_arb.py", encoding="utf-8-sig").read()
          tree = ast.parse(src)
          fns = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          required = {"kalman_hedge_ratio","half_life","engle_granger_pvalue",
                      "load_prices","scan_pairs","generate_signals","append_history","main"}
          missing = required - fns
          if missing:
              print(f"  FAIL stat_arb.py missing functions: {missing}")
              sys.exit(1)
          print(f"  stat_arb.py functions OK: {sorted(fns)} ✓")
          PYEOF

      - name: 7 — Import smoke test (no trading keys)
        env:
          ALPACA_API_KEY:    dummy
          ALPACA_SECRET_KEY: dummy
          ALPACA_BASE_URL:   https://paper-api.alpaca.markets
          RUN_TYPE:          scoring
          GH_ACTIONS:        'true'
        run: |
          python - <<'PYEOF'
          # Import the new modules used by patches (no network calls)
          import sys
          failed = []
          for mod in ["numpy","pandas","yfinance","statsmodels.tsa.stattools",
                      "xgboost","lightgbm","sklearn.model_selection",
                      "requests","pathlib","json","datetime","traceback"]:
              try:
                  __import__(mod)
                  print(f"  import {mod:<40} OK")
              except ImportError as e:
                  print(f"  import {mod:<40} MISSING: {e}")
                  failed.append(mod)
          if failed:
              print(f"\n  FAIL: {len(failed)} missing imports: {failed}")
              sys.exit(1)
          print("\n  All imports OK ✓")
          PYEOF

      - name: 8 — New patch logic unit tests
        run: |
          python - <<'PYEOF'
          import sys, numpy as np

          # ── Test kalman_hedge_ratio (from stat_arb.py) ─────────────────────
          sys.path.insert(0, ".")
          from stat_arb import kalman_hedge_ratio, half_life, engle_granger_pvalue

          rng  = np.random.default_rng(42)
          x    = np.cumsum(rng.standard_normal(300))
          beta = 1.5
          y    = beta * x + 0.05 * rng.standard_normal(300)

          betas, spread = kalman_hedge_ratio(y, x)
          final_beta    = betas[-1]
          assert 1.0 < final_beta < 2.0, f"Kalman hedge ratio out of range: {final_beta}"
          print(f"  kalman_hedge_ratio  PASS  final_beta={final_beta:.4f} (true=1.5)")

          hl = half_life(spread)
          assert 0 < hl < 500, f"half_life out of range: {hl}"
          print(f"  half_life           PASS  hl={hl:.1f} days")

          pval = engle_granger_pvalue(y, x)
          assert pval < 0.10, f"EG p-value too high for cointegrated pair: {pval}"
          print(f"  engle_granger_pvalue PASS  p={pval:.4f} (expect <0.05)")

          # ── Test Hurst exponent gating logic ──────────────────────────────
          def _hurst_scale_mean_rev(h, cs):
              scale = max(0.0, h / 0.45)
              return 0.5 + (cs - 0.5) * scale * 0.5

          def _hurst_scale_trend(h, cs):
              scale = min(1.5, 1.0 + (h - 0.55) / 0.45)
              return float(np.clip(0.5 + (cs - 0.5) * scale, 0.0, 1.0))

          # Mean-reverting: should compress signal toward 0.5
          new_cs = _hurst_scale_mean_rev(0.30, 0.80)
          assert new_cs < 0.80, f"Hurst MR should compress: {new_cs}"
          assert new_cs > 0.50, f"Hurst MR should stay above 0.5: {new_cs}"
          print(f"  Hurst MR gate       PASS  cs=0.80→{new_cs:.4f} (compressed)")

          # Trending: should amplify signal
          new_cs2 = _hurst_scale_trend(0.70, 0.70)
          assert new_cs2 > 0.70, f"Hurst trend should amplify: {new_cs2}"
          print(f"  Hurst trend gate    PASS  cs=0.70→{new_cs2:.4f} (amplified)")

          # ── Test Conformal Kelly discount ──────────────────────────────────
          def _conformal_kelly(cs, max_disc=0.60):
              certainty   = min(1.0, abs(cs - 0.5) / 0.5)
              uncertainty = 1.0 - certainty
              return round(1.0 - uncertainty * max_disc, 4)

          assert _conformal_kelly(0.5)  == 0.40, f"boundary score should give max discount"
          assert _conformal_kelly(1.0)  == 1.00, f"certainty=1 → no discount"
          assert _conformal_kelly(0.75) == 0.70, f"cs=0.75 → 30% discount"
          print(f"  Conformal Kelly     PASS  cs=0.5→{_conformal_kelly(0.5)}  cs=0.75→{_conformal_kelly(0.75)}  cs=1.0→{_conformal_kelly(1.0)}")

          # ── Test Gain-to-Pain ratio ────────────────────────────────────────
          monthly = np.array([100, -30, 80, -20, 50, -60, 90, -10, 40, -25, 70, -15])
          gains = monthly[monthly > 0].sum()
          pains = monthly[monthly < 0].sum()
          gpr   = gains / abs(pains)
          expected = (100+80+50+90+40+70) / (30+20+60+10+25+15)
          assert abs(gpr - expected) < 1e-6, f"GPR calc wrong: {gpr} vs {expected}"
          print(f"  Gain-to-Pain Ratio  PASS  GPR={gpr:.3f}")

          # ── Test regime sample weight matrix ──────────────────────────────
          REGIME_WEIGHTS = {
              (0,0):2.0,(0,1):1.0,(0,2):0.5,
              (1,0):0.75,(1,1):1.5,(1,2):0.75,
              (2,0):0.5,(2,1):1.0,(2,2):2.0,
          }
          assert REGIME_WEIGHTS[(0,0)] > REGIME_WEIGHTS[(0,2)], "bear now: bear samples > bull samples"
          assert REGIME_WEIGHTS[(2,2)] > REGIME_WEIGHTS[(2,0)], "bull now: bull samples > bear samples"
          assert REGIME_WEIGHTS[(1,1)] == 1.5, "neutral now: neutral samples get boost"
          print(f"  Regime weights      PASS  bear/bear={REGIME_WEIGHTS[(0,0)]}  bull/bull={REGIME_WEIGHTS[(2,2)]}")

          # ── Test WRC pnl_history reader contract (2026-07-24 basis fix) ────
          # The old reader did .get("total_pnl", 0) on a file with no such
          # column and would have scored an all-zero series silently. The new
          # contract: missing column REFUSES, blank cells are SKIPPED (never
          # zero-filled), values are consumed as a DAILY series without diff.
          import csv, io
          def _read_daily(text):
              r = csv.DictReader(io.StringIO(text))
              if "total_pnl" not in (r.fieldnames or []):
                  raise RuntimeError("no total_pnl column")
              out = []
              for row in r:
                  v = str(row.get("total_pnl") or "").strip()
                  if not v:
                      continue
                  try:
                      out.append(float(v))
                  except ValueError:
                      pass
              return out

          try:
              _read_daily("date,net_pl\n2026-07-01,5\n")
              assert False, "reader must refuse a file without total_pnl"
          except RuntimeError:
              print("  WRC reader refuse   PASS  (missing column raises, no zero-fill)")

          vals = _read_daily("date,total_pnl\n2026-07-01,\n2026-07-02,3.5\n2026-07-03,-1.25\n")
          assert vals == [3.5, -1.25], f"blank cells must be skipped, got {vals}"
          print("  WRC reader blanks   PASS  (blank = skipped, not zeroed)")

          # ── Test pnl_history daily-basis fallback (writer contract) ────────
          # When Alpaca's profit_loss is missing for a day, the fallback must
          # be the day-over-day equity change — never equity − window base,
          # which is cumulative and poisons the daily series (the 7/24 +$13k
          # tail-row bug).
          def _daily_fallback(pl, eqs):
              prev = None; out = []
              for i, e in enumerate(eqs):
                  if pl[i] is not None:
                      v = round(pl[i], 2)
                  elif prev is not None:
                      v = round(e - prev, 2)
                  else:
                      v = 0.0
                  out.append(v); prev = e
              return out

          got = _daily_fallback([None, None, 5.0], [100.0, 102.5, 107.5])
          assert got == [0.0, 2.5, 5.0], f"daily fallback wrong: {got}"
          print(f"  Daily-basis fallback PASS  {got} (equity diffs, not eq-base)")

          print("\n  ✓ All unit tests passed")
          PYEOF

      - name: 9 — Workflow YAML env var completeness
        run: |
          python - <<'PYEOF'
          import sys, re
          yml = open(".github/workflows/quant_daily.yml").read()
          required_keys = [
              "ALPACA_API_KEY","ALPACA_SECRET_KEY","FRED_API_KEY",
              "NEWS_API_KEY","QUIVER_QUANT_KEY","DISCORD_WEBHOOK_URL",
              "ALPHAVANTAGE_API_KEY","FINNHUB_API_KEY",
          ]
          ok = True
          for k in required_keys:
              if k in yml:
                  print(f"  {k:<30} PRESENT ✓")
              else:
                  print(f"  {k:<30} MISSING ✗")
                  ok = False
          stat_arb_step = "stat_arb.py" in yml
          data_stat_arb = "data/stat_arb/" in yml
          print(f"  stat_arb.py step               {'PRESENT ✓' if stat_arb_step else 'MISSING ✗'}")
          print(f"  data/stat_arb/ in commit       {'PRESENT ✓' if data_stat_arb else 'MISSING ✗'}")
          if not (ok and stat_arb_step and data_stat_arb):
              sys.exit(1)
          print("\n  Workflow YAML OK ✓")
          PYEOF

      - name: 10 — Workflow YAML actually parses
        run: |
          pip install --quiet pyyaml
          python - <<'PYEOF'
          import sys, glob, yaml

          # Check 9 only substring-greps quant_daily.yml, so a syntactically
          # broken workflow passes every other check and lands on master, where
          # an unparseable file means GitHub runs NOTHING — a silent trading
          # outage. Parse them all for real.
          ok = True
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  doc = yaml.safe_load(open(path, encoding="utf-8"))
                  assert isinstance(doc, dict), "top level is not a mapping"
                  print(f"  {path:<45} PARSES ✓")
              except Exception as e:
                  print(f"  {path:<45} BROKEN ✗  {type(e).__name__}: {e}")
                  ok = False

          # A `run: |` block scalar can stay valid YAML while silently losing
          # lines to a bad indent, so assert the run-type resolver survived
          # intact — it is the gate every dup-retrain fix hangs off.
          try:
              d = yaml.safe_load(open(".github/workflows/quant_daily.yml", encoding="utf-8"))
              step = [s for s in d["jobs"]["trade"]["steps"] if s.get("id") == "run_type"][0]
              body = step["run"]
              anchors = [
                  'echo "type=$TYPE" >> $GITHUB_OUTPUT',   # step output survives
                  "Morning marker:",                        # 7/8 checkout-race gate
                  "Market-hours guard:",                    # 7/24 overnight-retrain gate
              ]
              for a in anchors:
                  if a in body:
                      print(f"  run_type anchor {a[:38]:<40} PRESENT ✓")
                  else:
                      print(f"  run_type anchor {a[:38]:<40} MISSING ✗")
                      ok = False
          except Exception as e:
              print(f"  quant_daily.yml run_type step   UNREADABLE ✗  {type(e).__name__}: {e}")
              ok = False

          if not ok:
              sys.exit(1)
          print("\n  All workflow YAML parses ✓")
          PYEOF

      - name: 11 — Runner tz database resolves America/New_York
        run: |
          # The morning marker is an ET date (7/24 fix). If the runner image
          # ever ships without tzdata, `date` silently returns UTC and the
          # marker quietly reverts to the UTC rollover that caused the 7/24
          # zero-entry day — the resolver warns at runtime, but that is after
          # the fact. Prove it here instead. (Git Bash on Windows really does
          # return GMT for this, so it is not a hypothetical.)
          ZONE="$(TZ=America/New_York date +%Z 2>/dev/null || echo UNKNOWN)"
          ET="$(TZ=America/New_York date +%Y-%m-%d 2>/dev/null || echo none)"
          UTC="$(date -u +%Y-%m-%d)"
          echo "  zone=$ZONE  ET=$ET  UTC=$UTC"
          case "$ZONE" in
            EDT|EST) echo "  tz database resolves America/New_York ✓" ;;
            *) echo "  tz lookup FAILED (got '$ZONE') — the ET marker would silently fall back to UTC ✗"; exit 1 ;;
          esac
          echo "$ET" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            && echo "  ET date well-formed ✓" \
            || { echo "  ET date malformed ✗"; exit 1; }

      - name: 12 — Notebook code cells parse (the file that actually trades)
        run: |
          # Checks 1 and 2 py_compile / ast.parse every .py file in the repo —
          # but the thing that ACTUALLY TRADES is trading_model_v25.1.ipynb,
          # and until now nothing parsed it. A syntax error in a notebook cell
          # passed every preflight check and only surfaced at runtime, in a
          # live morning run, as a broken retrain. That is precisely the 8/21
          # river-break shape (Cell 2 raised -> _get_macro_history -> 0/0
          # models) and it cost a Frame-1 evidence day inside the S4 window.
          #
          # Magics (%matplotlib inline, !pip ...) are not Python; they are
          # blanked to empty lines so real line numbers survive in any error.
          python - <<'PYEOF'
          import ast, json, sys

          NB = "trading_model_v25.1.ipynb"
          nb = json.load(open(NB, encoding="utf-8-sig"))

          ok, checked, magics = True, 0, 0
          for idx, cell in enumerate(nb.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              src = cell.get("source", [])
              if isinstance(src, list):
                  src = "".join(src)
              lines = src.split("\n")
              for i, ln in enumerate(lines):
                  s = ln.lstrip()
                  if s.startswith("!") or s.startswith("%"):
                      lines[i] = ""
                      magics += 1
              src = "\n".join(lines)
              if not src.strip():
                  continue
              checked += 1
              try:
                  ast.parse(src)
                  print(f"  AST OK   : cell {idx:>2}  ({len(lines)} lines)")
              except SyntaxError as e:
                  ok = False
                  print(f"  AST FAIL : cell {idx:>2}  line={e.lineno}  {e.msg}")
                  bad = (e.text or "").rstrip()
                  if bad:
                      print(f"             >>> {bad}")

          print("")
          print(f"  {checked} code cell(s) parsed, {magics} magic line(s) blanked")
          if not ok:
              print("  NOTEBOOK DOES NOT PARSE — this would break the next morning run.")
          sys.exit(0 if ok else 1)
          PYEOF

      - name: 13 — Notebook is valid JSON with the expected cell structure
        run: |
          # The notebook is minified JSON edited by hand and by scripts. A
          # replacement that turns a "\n" ESCAPE into a real newline yields a
          # file that still looks right in a diff but is no longer valid JSON
          # — a literal control character inside a string. json.loads() is the
          # honest check and it catches exactly that; this patch produced the
          # failure twice while being written, so it is not hypothetical.
          #
          # NOTE: do NOT try to detect the corruption by scanning parsed
          # source chunks for interior newlines. nbformat permits a cell to
          # store its whole body as one multi-line chunk (9 cells here do),
          # and AFTER parsing a legitimate multi-line chunk is byte-identical
          # to a corrupted one. The distinction exists only in the raw bytes,
          # where json.loads already rejects it. An earlier draft of this
          # check made that mistake and failed on healthy cells.
          python - <<'PYEOF'
          import json, sys

          NB = "trading_model_v25.1.ipynb"
          raw = open(NB, encoding="utf-8-sig").read()
          try:
              nb = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"  JSON FAIL: line={e.lineno} col={e.colno}  {e.msg}")
              print("  A literal newline inside a JSON string is the usual cause:")
              print("  a hand-edit wrote a real line break where \\n belonged.")
              sys.exit(1)

          cells = nb.get("cells", [])
          code = [c for c in cells if c.get("cell_type") == "code"]
          print(f"  JSON OK  : {len(cells)} cells ({len(code)} code)")

          # Structural floor. quant_runner indexes cells POSITIONALLY
          # (SKIP_BY_TYPE, CELL_TAGS), so a cell appearing or disappearing
          # silently re-points every skip list. Assert the shape rather than
          # the content.
          EXPECT_TOTAL, EXPECT_CODE = 24, 23
          ok = True
          if len(cells) != EXPECT_TOTAL or len(code) != EXPECT_CODE:
              print(f"  CELL COUNT CHANGED: expected {EXPECT_TOTAL} total / "
                    f"{EXPECT_CODE} code, got {len(cells)} / {len(code)}.")
              print("  quant_runner indexes cells by POSITION — SKIP_BY_TYPE and")
              print("  CELL_TAGS are now pointing at different cells. If this is")
              print("  intentional, update those and bump the expectation here.")
              ok = False
          else:
              print(f"  cell structure unchanged ({EXPECT_TOTAL}/{EXPECT_CODE}) ✓")

          empty = [i for i, c in enumerate(cells)
                   if c.get("cell_type") == "code"
                   and not "".join(c.get("source", [])).strip()]
          if empty:
              print(f"  WARNING: empty code cell(s) at {empty}")

          sys.exit(0 if ok else 1)
          PYEOF
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "PREFLIGHT DIAGNOSTICS COMPLETE"
          echo "════════════════════════════════════════"

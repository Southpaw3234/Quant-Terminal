name: Quant Terminal v24.1 - Daily Cycle

on:
  schedule:
    # 9:35 AM ET (EDT = UTC-4).  GitHub free-tier may delay by up to ~2 hrs.
    - cron: '35 13 * * 1-5'
  workflow_dispatch:   # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 2-hour hard cap

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install rclone
        run: sudo apt-get install -y rclone

      - name: Run Quant Terminal v24.1 cycle
        env:
          GH_ACTIONS: 'true'
          GDRIVE_RCLONE_CONF:    ${{ secrets.GDRIVE_RCLONE_CONF }}
          ALPACA_API_KEY:        ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:     ${{ secrets.ALPACA_SECRET_KEY }}
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          AV_API_KEY:            ${{ secrets.AV_API_KEY }}
        run: python quant_runner.py 2>&1 | tee cycle_output.log

      - name: Upload cycle log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-log-${{ github.run_number }}
          path: cycle_output.log
          retention-days: 30

name: Quant Terminal v25.1 — 24/7 Trading

on:
  schedule:
    # ── Morning full cycle: macro + train + signals + trade (9:35 AM ET) ──
    # GitHub's scheduler is best-effort and silently drops ticks, so fire
    # several redundant morning attempts (9:35 / 9:50 / 10:05 ET). The run-type
    # logic below makes the FIRST one that lands do the retrain (marker-gated);
    # any later duplicate downgrades to a cheap intraday refresh. One on-time
    # success is all that's needed — no PC / external trigger dependency.
    - cron: '35 13 * * 1-5'
    - cron: '50 13 * * 1-5'
    - cron: '05 14 * * 1-5'
    # ── Midday signal refresh: load cached models + re-signal (12:00 PM ET) ──
    - cron: '00 16 * * 1-5'
    # ── Intraday model refresh: 2-hour resolution (11:00 AM ET) ─────────────
    - cron: '00 15 * * 1-5'
    # ── Pre-close refresh: final signals before close (3:00 PM ET) ─────────
    - cron: '00 19 * * 1-5'
    # ── Close + scoring: score outcomes + self-learning (5:30 PM ET) ────────
    - cron: '30 21 * * 1-5'
    # ── Weekend scoring: score any matured predictions Saturday morning ──────
    - cron: '00 14 * * 6'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type override'
        required: false
        default: 'morning'
        type: choice
        options: [morning, intraday, evening, scoring]
      force:
        description: 'Force a full morning retrain even if one already ran today'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: quant-terminal
  cancel-in-progress: false   # never cancel a live trading run mid-flight

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pandas-ta (pandas 2 compat via no-deps)
        run: pip install --no-deps "pandas-ta==0.3.14b0" || true

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Determine run type from schedule
        id: run_type
        run: |
          MANUAL="${{ github.event.inputs.run_type }}"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DAY=$(date -u +%u)   # 1=Mon ... 6=Sat

          if [ -n "$MANUAL" ]; then
            TYPE="$MANUAL"
          elif [ "$HOUR" = "13" ] || [ "$HOUR" = "14" ]; then
            TYPE="morning"
          elif [ "$HOUR" = "16" ] || [ "$HOUR" = "17" ] || [ "$HOUR" = "18" ]; then
            TYPE="intraday"
          elif [ "$HOUR" = "19" ]; then
            TYPE="intraday"
          elif [ "$HOUR" = "21" ] || [ "$DAY" = "6" ]; then
            TYPE="evening"
          else
            TYPE="morning"
          fi

          # ── Self-healing morning retrain (scheduled weekday runs) ──────────
          # GitHub's `schedule` cron is best-effort and silently drops ticks, so
          # the single 9:35 ET morning trigger has missed for days (no retrain →
          # no signals all day). Strategy: fire several morning-window crons
          # (above) AND make the day's FIRST scheduled cycle do the retrain,
          # tracked by a committed data/last_morning_run.txt marker:
          #   • no morning recorded today  -> force morning (covers a dropped
          #     9:35 tick; a later intraday cycle will catch up if all morning
          #     ticks drop)
          #   • morning already done today -> a duplicate morning-window cron
          #     downgrades to a cheap intraday refresh (no wasteful 2nd retrain)
          # Manual dispatches are left exactly as requested (explicit intent).

          # Dup-retrain #3 fix — marker CHECKOUT RACE (2026-07-08 incident): a run
          # queued behind the morning run in the concurrency group can check out a
          # commit resolved BEFORE the marker commit lands (7/8: missed it by ~10 s),
          # so the workspace copy of data/last_morning_run.txt lies and the gate
          # fires a duplicate full retrain. Re-read the marker from origin/master's
          # tip at decision time — it is never older than the checkout — and fall
          # back to the workspace file only if the fetch fails.
          git fetch --quiet origin master || true
          MARKER_REF="$( (git show FETCH_HEAD:data/last_morning_run.txt 2>/dev/null || true) | tr -d '[:space:]')"
          MARKER_WS=""
          [ -f data/last_morning_run.txt ] && MARKER_WS="$(cat data/last_morning_run.txt | tr -d '[:space:]')"
          LAST_MORNING="$MARKER_REF"
          [ -z "$LAST_MORNING" ] && LAST_MORNING="$MARKER_WS"
          echo "Morning marker: origin/master='$MARKER_REF' checkout='$MARKER_WS' -> using '$LAST_MORNING'"

          if [ -z "$MANUAL" ] && [ "$DAY" -le 5 ]; then
            TODAY=$(date -u +%Y-%m-%d)
            if [ "$LAST_MORNING" != "$TODAY" ]; then
              echo "Self-heal: no morning retrain for $TODAY (last=$LAST_MORNING) — running morning."
              TYPE="morning"
            elif [ "$TYPE" = "morning" ]; then
              echo "Morning retrain already done for $TODAY — downgrading duplicate morning cron to intraday refresh."
              TYPE="intraday"
            fi
          fi

          # Explicit morning dispatches are marker-gated too: the workstation's
          # Task-Scheduler catch-up fired a stale run_type=morning on PC wake
          # (2026-07-07) and forced a duplicate retrain + duplicate BUY batch.
          # A same-day second full morning now requires force=true.
          FORCE="${{ github.event.inputs.force }}"
          if [ "$TYPE" = "morning" ] && [ -n "$MANUAL" ] && [ "$FORCE" != "true" ]; then
            # Same race-proof marker as above (origin/master tip, workspace fallback).
            if [ "$LAST_MORNING" = "$(date -u +%Y-%m-%d)" ]; then
              echo "Explicit morning dispatch but retrain already done today — downgrading to intraday (dispatch with force=true to override)."
              TYPE="intraday"
            fi
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Run type: $TYPE (UTC hour=$HOUR day=$DAY)"

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: data/models/
          key: model-cache-${{ steps.run_type.outputs.type == 'morning' && github.run_id || 'latest' }}
          restore-keys: |
            model-cache-

      - name: Run trading cycle
        env:
          GH_ACTIONS: 'true'
          RUN_TYPE:              ${{ steps.run_type.outputs.type }}
          GDRIVE_RCLONE_CONF:    ${{ secrets.GDRIVE_RCLONE_CONF }}
          ALPACA_API_KEY:        ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:     ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:       'https://paper-api.alpaca.markets'
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          QUIVER_QUANT_KEY:      ${{ secrets.QUIVER_QUANT_KEY }}
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALPHAVANTAGE_API_KEY:  ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          GIT_USER_EMAIL:        'quant-bot@github-actions'
          GIT_USER_NAME:         'Quant Terminal Bot'
        run: python quant_runner.py

      - name: Record morning retrain marker
        if: steps.run_type.outputs.type == 'morning'
        run: date -u +%Y-%m-%d > data/last_morning_run.txt

      - name: Run stat-arb pairs scanner (morning weekly)
        if: steps.run_type.outputs.type == 'morning'
        run: python stat_arb.py || echo "Stat-arb non-fatal error — continuing"

      - name: Run stat-arb SHADOW book (morning, Frame 3 measurement-only)
        # Consumes the scanner's data/stat_arb/signals.json + pairs.json (written by
        # the step above) and advances a forward-only PAPER book → marks to market,
        # applies entries/exits (reversion / z>3.5 blowout / 3x-half-life time stop /
        # de-cointegration), charges 5 bps/leg, appends the book's daily net return to
        # data/stat_arb/stat_arb_ls.csv (committed below via the data/stat_arb/
        # pathspec). SHADOW ONLY — places NO Alpaca orders, touches NO live-model
        # state; the Frame-3 analog of analyze_rank_ic.py. Non-fatal so a yfinance
        # hiccup never blocks the trading commit. Idempotent per date.
        if: steps.run_type.outputs.type == 'morning'
        run: python shadow_stat_arb.py || echo "shadow stat-arb non-fatal error — continuing"

      - name: Stat-arb gate scorecard (morning, measurement-only)
        # P2 of the Frame-3 plan (scoped 2026-06-29, built 2026-07-09): prints
        # beta-to-SPY / max-DD / Sharpe / %win for the shadow book with the
        # blind-committed gates (|beta|<0.2, max-DD>-15%, >=30-obs window);
        # Sharpe/%win report-only. Reads data/stat_arb/*.csv, writes nothing.
        if: steps.run_type.outputs.type == 'morning'
        run: python analyze_stat_arb.py || echo "stat-arb scorecard non-fatal error — continuing"

      - name: Run intraday model
        if: steps.run_type.outputs.type != 'evening'
        env:
          GH_ACTIONS: 'true'
          RUN_TYPE: ${{ steps.run_type.outputs.type }}
        run: python model_intraday.py || echo "Intraday model non-fatal error — continuing"

      - name: Frame-2 shadow harness (morning, measurement-only)
        # P0 (scoped 7/9 ledger ⑦, defaults LOCKED): logs the intraday model's
        # raw pre-blend scores from data/predictions/intraday_signals.json
        # (only rows whose "generated" stamp is today — a stale committed file
        # is never re-logged), matures them vs the realized next-session
        # open->close return, appends daily Spearman rank-IC (equities only)
        # to data/shadow_intraday/. Prints "armed" and exits 0 until the model
        # first trains (~Aug 2026). SHADOW ONLY — no orders, no live-model
        # state. Idempotent per date; non-fatal.
        if: steps.run_type.outputs.type == 'morning'
        run: python shadow_intraday.py || echo "shadow-intraday non-fatal error — continuing"

      - name: Frame-2 shadow L/S + gate scorecard (morning, measurement-only)
        # P1+P2 (defaults locked 7/9): derives the balanced-decile long-short
        # series (equities only, open->close, causal SPY-hedged overlay) from
        # the P0 harness's matured predictions and prints the blind gate
        # scorecard (rank-IC >= 0.03 t>=2, |beta|<0.2, max-DD>-15%, >=30 obs;
        # Sharpe/%win report-only). Rewrites only the derived
        # data/shadow_intraday/cross_sectional_ls.csv. Armed-notice until the
        # P0 clock has data. Non-fatal.
        if: steps.run_type.outputs.type == 'morning'
        run: python analyze_shadow_intraday.py || echo "frame2 scorecard non-fatal error — continuing"

      - name: Save model cache (morning only)
        if: steps.run_type.outputs.type == 'morning'
        uses: actions/cache@v4
        with:
          path: data/models/
          key: model-cache-${{ github.run_id }}

      - name: Compute cross-sectional rank-IC (morning, measurement-only)
        # Reads the model's per-name predicted confidence from predictions.csv and
        # recomputes forward returns from price history to produce the Stage-1 gate's
        # rank-IC series → data/shadow/rank_ic.csv (committed by the step below via
        # the data/shadow/ pathspec). Pure measurement: changes nothing the model
        # trades, does not depend on the broken predictions.csv scorer. Non-fatal so
        # a yfinance hiccup never blocks the trading commit.
        if: steps.run_type.outputs.type == 'morning'
        run: python analyze_rank_ic.py || echo "rank-IC analysis non-fatal error — continuing"

      - name: Commit updated state files to master
        # MUST run BEFORE the orphan-data-branch step below. That step does
        # `git checkout -f "$GITHUB_REF_NAME"`, and `git checkout -f` force-resets
        # the working tree to master's HEAD — DISCARDING every uncommitted tracked
        # modification (shadow/, stat_arb/, paper_trades/, predictions/, weights/)
        # while leaving untracked new files (intraday_history/) alone. That is why,
        # from 2026-06-09 to 2026-06-16, every `Auto:` commit carried ONLY
        # intraday_history and the shadow/stat-arb evidence clock froze: the engines
        # wrote their files fine, but the data-branch dance wiped the tracked ones
        # before this commit step ever saw them. Committing here first puts those
        # changes safely in a real commit, so the later `checkout -f` is harmless.
        #
        # Only persist regenerated state on the live master branch. On a
        # feature-branch dispatch (e.g. a GPU test run on feat/maximize-model)
        # this step is skipped so test runs stay fully isolated from master and
        # never push state files there.
        if: github.ref_name == 'master'
        env:
          GIT_USER_EMAIL: 'quant-bot@github-actions'
          GIT_USER_NAME:  'Quant Terminal Bot'
        run: |
          git config user.email "$GIT_USER_EMAIL"
          git config user.name  "$GIT_USER_NAME"
          # COMMIT FIRST, then rebase, then push. Do NOT pull --rebase before staging:
          # --autostash stashes the *tracked* state modifications and the pop can
          # silently drop them (swallowed by `|| true`). Committing first puts every
          # change in a real commit that the subsequent rebase replays cleanly.
          # Stage state files — explicitly exclude docs/data.json (lives on data branch).
          # Add each path INDEPENDENTLY: `git add a b c` is atomic and aborts staging
          # ALL paths if any one pathspec doesn't match (e.g. data/models/intraday_model.pkl
          # never exists while the intraday model can't train), which silently staged
          # nothing → commit skipped. Looping isolates missing paths.
          for p in data/paper_trades/ data/predictions/ data/weights/ \
                   data/intraday_history/ data/models/intraday_model.pkl \
                   data/stat_arb/ data/shadow/ data/shadow_intraday/ \
                   data/last_morning_run.txt docs/index.html; do
            git add "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Auto: ${{ steps.run_type.outputs.type }} cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin master || git rebase --abort || true
            git push origin master || true
          fi

      - name: Push dashboard data to orphan data branch
        env:
          GIT_USER_EMAIL: 'quant-bot@github-actions'
          GIT_USER_NAME:  'Quant Terminal Bot'
        run: |
          git config user.email "$GIT_USER_EMAIL"
          git config user.name  "$GIT_USER_NAME"
          # Push docs/data.json to an orphan `data` branch that is force-replaced each
          # cycle. This single-commit branch never accumulates history, keeping master
          # clean and the repo well under GitHub's 1 GB limit.
          if [ -f docs/data.json ]; then
            git checkout --orphan data-tmp
            git reset
            git add -f docs/data.json
            git commit -m "data: ${{ steps.run_type.outputs.type }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin data-tmp:data --force
            # Return to the branch the run was dispatched on. Was hardcoded to
            # `master`, which fails on a feature-branch dispatch: the shallow
            # (fetch-depth:1) checkout has no local `master` ref, so the orphan
            # dance left HEAD detached and `git checkout master` errored out
            # (exit 1) after the data push had already succeeded. $GITHUB_REF_NAME
            # is the dispatched branch on master AND on feature branches.
            git checkout -f "$GITHUB_REF_NAME" || git checkout -f master
            git branch -D data-tmp || true
            echo "data.json pushed to data branch OK"
          else
            echo "docs/data.json not found — skipping data branch push"
          fi

      - name: Verify evidence-clock persistence (alarm only)
        # Belt-and-suspenders guard for the regression that froze the evidence clock
        # from 2026-06-09 to 2026-06-16: an `Auto:` morning commit must carry the
        # evidence/state files, not just intraday_history. This does NOT block the
        # run (continue-on-error) — it only surfaces a loud ::warning:: (and pings
        # Discord if configured) so a future persistence regression is caught the
        # same day instead of weeks later. Only meaningful on master morning commits.
        if: github.ref_name == 'master' && steps.run_type.outputs.type == 'morning'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          msg=""
          if git log -1 --pretty=%s | grep -q '^Auto:'; then
            stat="$(git show --stat --name-only --pretty=format: HEAD)"
            wants="data/shadow/ data/stat_arb/ data/predictions/"
            # Frame-2 clock is guarded only once it has actually started (the
            # harness is armed-but-idle until the intraday model first trains).
            [ -f data/shadow_intraday/predictions.csv ] && wants="$wants data/shadow_intraday/"
            for want in $wants; do
              echo "$stat" | grep -q "$want" || msg="${msg} ${want}"
            done
          else
            echo "HEAD is not an Auto commit (no state changes this run) — skipping guard."
            exit 0
          fi
          if [ -n "$msg" ]; then
            echo "::warning::Evidence clock may have stalled — latest Auto commit is missing:${msg}"
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              curl -s -H 'Content-Type: application/json' \
                -d "{\"content\":\"⚠️ Quant-Terminal: latest Auto commit missing evidence files:${msg}\"}" \
                "$DISCORD_WEBHOOK_URL" >/dev/null || true
            fi
          else
            echo "✅ Evidence files present in latest Auto commit (shadow/stat_arb/predictions)."
          fi

      - name: Upload cycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ steps.run_type.outputs.type }}-${{ github.run_number }}
          path: cycle_output.log
          retention-days: 60

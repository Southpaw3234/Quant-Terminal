name: Quant Terminal v25.1 — 24/7 Trading

on:
  schedule:
    # ── Morning full cycle: macro + train + signals + trade (9:35 AM ET) ──
    # GitHub's scheduler is best-effort and silently drops ticks, so fire
    # several redundant morning attempts (9:35 / 9:50 / 10:05 ET). The run-type
    # logic below makes the FIRST one that lands do the retrain (marker-gated);
    # any later duplicate downgrades to a cheap intraday refresh. One on-time
    # success is all that's needed — no PC / external trigger dependency.
    - cron: '35 13 * * 1-5'
    - cron: '50 13 * * 1-5'
    - cron: '05 14 * * 1-5'
    # ── Midday signal refresh: load cached models + re-signal (12:00 PM ET) ──
    - cron: '00 16 * * 1-5'
    # ── Intraday model refresh: 2-hour resolution (11:00 AM ET) ─────────────
    - cron: '00 15 * * 1-5'
    # ── Pre-close refresh: final signals before close (3:00 PM ET) ─────────
    - cron: '00 19 * * 1-5'
    # ── Close + scoring: score outcomes + self-learning (5:30 PM ET) ────────
    - cron: '30 21 * * 1-5'
    # ── Weekend scoring: score any matured predictions Saturday morning ──────
    - cron: '00 14 * * 6'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type override'
        required: false
        default: 'morning'
        type: choice
        options: [morning, intraday, evening, scoring]
      force:
        description: 'Force a full morning retrain even if one already ran today'
        required: false
        default: false
        type: boolean
      wind_down_drill:
        description: 'FIRE DRILL: comma-separated fake symbols to inject into the flat-invariant CHECK ONLY (e.g. DRILL1). Places no orders; deliberately reds the run.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: quant-terminal
  cancel-in-progress: false   # never cancel a live trading run mid-flight

jobs:
  # ── SUNSET GATE (2026-08-09 wind-down) ──────────────────────────────────────
  # The alpha search is closed (HANDOFF §"🏁 THE ALPHA SEARCH IS OVER"). Crons
  # stay up only until S4, the last pre-registered read, lands ~2026-09-24 —
  # after that this workflow must stop on its own.
  #
  # Why a gate job and not "delete the schedule block later": that needs a human
  # to remember, six weeks after the project went quiet. This repo already
  # learned that lesson — the 2026-06-04 morning self-heal was fixed in-repo
  # precisely so it needed no PC, no PAT and no external dependency. Same rule.
  #
  # Why a separate job rather than a job-level `if:`: GitHub expressions have no
  # "now", so the date has to be computed in a shell. This costs ~5s per tick
  # instead of ~2h, and after sunset `trade` reports SKIPPED (not failed), so it
  # generates no false alarms.
  #
  # Reversible: change QT_SUNSET_DATE. Final cleanup once it has fired is
  # `gh workflow disable quant_daily.yml` — the gate makes that cosmetic.
  sunset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    env:
      QT_SUNSET_DATE: '2026-09-25'   # day AFTER S4's expected read (~2026-09-24)
    steps:
      - id: check
        run: |
          set -u
          # ET, not UTC — same reasoning as the watchdog and the marker (8d3e9df).
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          # ISO dates compare correctly as strings; verified 09-24 RUN / 09-25 SUNSET.
          if [[ "$TODAY_ET" < "$QT_SUNSET_DATE" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "pre-sunset (${TODAY_ET} < ${QT_SUNSET_DATE}) — running normally."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "SUNSET: ${TODAY_ET} >= ${QT_SUNSET_DATE}. The alpha search is closed"
            echo "and S4, the last pre-registered read, has landed. Skipping the cycle."
            echo "This is the wind-down working as designed, NOT a failure."
          fi
        shell: bash

  trade:
    needs: sunset
    if: needs.sunset.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pandas-ta (pandas 2 compat via no-deps)
        run: pip install --no-deps "pandas-ta==0.3.14b0" || true

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Determine run type from schedule
        id: run_type
        run: |
          MANUAL="${{ github.event.inputs.run_type }}"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DAY=$(date -u +%u)   # 1=Mon ... 6=Sat

          # Weekend ticks resolve FIRST (2026-07-11 incident): the Saturday
          # scoring cron (14:00 UTC) fell through to the hour checks below and
          # ran as a FULL morning retrain + live BUY whenever GitHub's delay
          # left it inside the 14:xx hour. The two prior Saturdays only passed
          # because the tick slipped past 15:00. Day-of-week must outrank hour.
          if [ -n "$MANUAL" ]; then
            TYPE="$MANUAL"
          elif [ "$DAY" = "6" ] || [ "$DAY" = "7" ]; then
            TYPE="evening"
          elif [ "$HOUR" = "13" ] || [ "$HOUR" = "14" ]; then
            TYPE="morning"
          elif [ "$HOUR" = "16" ] || [ "$HOUR" = "17" ] || [ "$HOUR" = "18" ]; then
            TYPE="intraday"
          elif [ "$HOUR" = "19" ]; then
            TYPE="intraday"
          elif [ "$HOUR" = "21" ]; then
            TYPE="evening"
          else
            TYPE="morning"
          fi

          # ── Self-healing morning retrain (scheduled weekday runs) ──────────
          # GitHub's `schedule` cron is best-effort and silently drops ticks, so
          # the single 9:35 ET morning trigger has missed for days (no retrain →
          # no signals all day). Strategy: fire several morning-window crons
          # (above) AND make the day's FIRST scheduled cycle do the retrain,
          # tracked by a committed data/last_morning_run.txt marker:
          #   • no morning recorded today  -> force morning (covers a dropped
          #     9:35 tick; a later intraday cycle will catch up if all morning
          #     ticks drop)
          #   • morning already done today -> a duplicate morning-window cron
          #     downgrades to a cheap intraday refresh (no wasteful 2nd retrain)
          # Manual dispatches are left exactly as requested (explicit intent).

          # Dup-retrain #3 fix — marker CHECKOUT RACE (2026-07-08 incident): a run
          # queued behind the morning run in the concurrency group can check out a
          # commit resolved BEFORE the marker commit lands (7/8: missed it by ~10 s),
          # so the workspace copy of data/last_morning_run.txt lies and the gate
          # fires a duplicate full retrain. Re-read the marker from origin/master's
          # tip at decision time — it is never older than the checkout — and fall
          # back to the workspace file only if the fetch fails.
          git fetch --quiet origin master || true
          MARKER_REF="$( (git show FETCH_HEAD:data/last_morning_run.txt 2>/dev/null || true) | tr -d '[:space:]')"
          MARKER_WS=""
          [ -f data/last_morning_run.txt ] && MARKER_WS="$(cat data/last_morning_run.txt | tr -d '[:space:]')"
          LAST_MORNING="$MARKER_REF"
          [ -z "$LAST_MORNING" ] && LAST_MORNING="$MARKER_WS"
          echo "Morning marker: origin/master='$MARKER_REF' checkout='$MARKER_WS' -> using '$LAST_MORNING'"

          # ── The marker is an ET date, not a UTC one (2026-07-24 root cause) ──
          # The marker answers "has the retrain run for THIS TRADING DAY?", and a
          # trading day is an ET day. Comparing it against `date -u` made it roll
          # over at 8 PM ET (7 PM under EST), so every run in that window saw
          # yesterday's marker as stale and self-healed into an after-hours
          # retrain -- which then advanced the marker and downgraded the real
          # morning run to intraday (7/24: a zero-entry trading day).
          # TZ=America/New_York tracks EDT/EST automatically. If the tz database
          # is missing, `date` silently returns UTC, so the zone is verified and
          # the fallback is loud: degrade to exactly the old UTC behaviour rather
          # than take the system offline -- the 13-20Z guard below is the backstop.
          # HOUR/MIN/DAY deliberately stay UTC: the hour branches and the 7/11
          # weekend fix are all written against UTC and must not shift.
          UTC_TODAY="$(date -u +%Y-%m-%d)"
          ET_ZONE="$(TZ=America/New_York date +%Z 2>/dev/null || echo UNKNOWN)"
          ET_TODAY="$(TZ=America/New_York date +%Y-%m-%d 2>/dev/null || echo "$UTC_TODAY")"
          case "$ET_ZONE" in
            EDT|EST)
              TODAY_ET="$ET_TODAY" ;;
            *)
              TODAY_ET="$UTC_TODAY"
              echo "::warning::tz lookup for America/New_York failed (zone='$ET_ZONE') — falling back to the UTC date for the morning marker." ;;
          esac
          echo "Trading date: ET='$TODAY_ET' (UTC='$UTC_TODAY', zone='$ET_ZONE')"
          echo "today_et=$TODAY_ET" >> $GITHUB_OUTPUT

          if [ -z "$MANUAL" ] && [ "$DAY" -le 5 ]; then
            TODAY="$TODAY_ET"
            if [ "$LAST_MORNING" != "$TODAY" ]; then
              echo "Self-heal: no morning retrain for $TODAY (last=$LAST_MORNING) — running morning."
              TYPE="morning"
            elif [ "$TYPE" = "morning" ]; then
              echo "Morning retrain already done for $TODAY — downgrading duplicate morning cron to intraday refresh."
              TYPE="intraday"
            fi
          fi

          # Explicit morning dispatches are marker-gated too: the workstation's
          # Task-Scheduler catch-up fired a stale run_type=morning on PC wake
          # (2026-07-07) and forced a duplicate retrain + duplicate BUY batch.
          # A same-day second full morning now requires force=true.
          FORCE="${{ github.event.inputs.force }}"
          if [ "$TYPE" = "morning" ] && [ -n "$MANUAL" ] && [ "$FORCE" != "true" ]; then
            # Same race-proof marker as above (origin/master tip, workspace fallback).
            if [ "$LAST_MORNING" = "$TODAY_ET" ]; then
              echo "Explicit morning dispatch but retrain already done today — downgrading to intraday (dispatch with force=true to override)."
              TYPE="intraday"
            fi
          fi

          # ── Market-hours guard on the morning retrain (2026-07-24 incident) ──
          # A full morning retrain must only resolve when it can actually trade.
          # Two paths could fire one overnight:
          #   • the catch-all `else TYPE="morning"` above swallows every hour not
          #     named in the branches — including 00-12 and 22-23;
          #   • the self-heal compares against a UTC date, but the UTC day rolls
          #     over at 8 PM ET, so from 00:00Z the marker (still yesterday's)
          #     looks stale and forces a "morning" that is really last night.
          # 7/24: a 00:00:03Z dispatch retrained 00:00-01:46Z (8-9:46 PM ET Thu),
          # traded nothing (market shut), advanced the marker, and so downgraded
          # the real 13:35Z morning to intraday -> a zero-entry trading day. It
          # also ran the kill switch blind (Alpaca timed out; the P&L drawdown
          # check skipped) and printed no gross-cap/oversell-guard lines at all,
          # because no BUY path is reached outside market hours.
          # 13-20Z covers the US session in both DST regimes (EDT 13:30-20:00Z,
          # EST 14:30-21:00Z) and leaves the 16/17/18Z self-heal path intact.
          # force=true is a deliberate manual override and is left alone.
          # 10# forces base 10: bash reads a bare 08/09 as invalid octal and dies.
          HOUR_N=$((10#$HOUR))
          if [ "$TYPE" = "morning" ] && [ "$FORCE" != "true" ]; then
            if [ "$HOUR_N" -lt 13 ] || [ "$HOUR_N" -gt 20 ]; then
              echo "Market-hours guard: morning retrain resolved at ${HOUR}:${MIN} UTC, outside the 13-20Z session window — downgrading to intraday (dispatch with force=true to override)."
              TYPE="intraday"
            fi
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Run type: $TYPE (UTC hour=$HOUR day=$DAY)"

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: data/models/
          key: model-cache-${{ steps.run_type.outputs.type == 'morning' && github.run_id || 'latest' }}
          restore-keys: |
            model-cache-

      - name: Run trading cycle
        env:
          GH_ACTIONS: 'true'
          RUN_TYPE:              ${{ steps.run_type.outputs.type }}
          # ── WIND-DOWN 2026-08-09: alpha search STOPPED, coast to flat ──────
          # The user's decision after S3 failed (HANDOFF §"STOPPING RULE",
          # 8/09 ledger). NO NEW ENTRIES, ever — not "until the kill switch
          # untrips". Implemented by reusing the gross-cap gate rather than
          # adding code: room = ratio*equity - gross, so ratio 0 makes room
          # negative and every BUY is pre-blocked. The gate is BUY-ONLY
          # (quant_runner.py:5723); SELLs run through _oversell_cap
          # (:5726), so exits still work.
          # Backed by 7 validated scenarios in validate §3 — no new anchors,
          # no new failure surface, and reversible by changing this one line.
          QT_MAX_GROSS:          '0'
          # ── 2026-08-10: the book does NOT close out "naturally" ────────────
          # The line above used to claim it would. The 8/10 weekly review
          # disproved that. close_long was driven by the SELL-labelled signal
          # universe, which never intersects the book: 34 SELL labels over
          # 8/06-8/10, ZERO of them held, because the net-of-cost bar admits
          # only names pinned at the 0.10 confidence clamp and the book holds
          # nothing near it (all 24 names sit at rank_score >= 0.54). The only
          # exit in the window (HON) came from stops/expiry. At that rate —
          # one exit in four sessions — roughly 16 positions would still be
          # open when the crons retire on QT_SUNSET_DATE.
          # So flat has to be asked for. With this set, the next run that
          # reaches Cell 13 submits market SELLs for every held LONG (shorts
          # are skipped, never doubled — the 7/15 incident). It is idempotent:
          # once the book is empty, later runs close 0 and say so. Reversible
          # by removing this line, though fills are not.
          # Validated: validate §17, 22 scenarios (run 31417929408).
          QT_WIND_DOWN:          '1'
          # Fire-drill for the flat invariant. Empty on every scheduled run, so
          # this is inert unless a human types symbols into the dispatch form.
          # Injects into the invariant CHECK ONLY — the closing loop iterates
          # the real broker book, which the drill never touches, so it cannot
          # place an order. Validated in §17.
          QT_WIND_DOWN_DRILL:    ${{ inputs.wind_down_drill }}
          GDRIVE_RCLONE_CONF:    ${{ secrets.GDRIVE_RCLONE_CONF }}
          ALPACA_API_KEY:        ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:     ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:       'https://paper-api.alpaca.markets'
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          QUIVER_QUANT_KEY:      ${{ secrets.QUIVER_QUANT_KEY }}
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALPHAVANTAGE_API_KEY:  ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          GIT_USER_EMAIL:        'quant-bot@github-actions'
          GIT_USER_NAME:         'Quant Terminal Bot'
        run: python quant_runner.py

      - name: Record morning retrain marker
        if: steps.run_type.outputs.type == 'morning'
        # Reuse the SAME date the gate compared against rather than recomputing
        # it here. This step runs 2-3 h after the gate, so an independent `date`
        # call could land on the next day and write a marker the gate would never
        # match -- silently re-arming the duplicate retrain the marker prevents.
        # An empty or malformed marker is worse than a stale one: the gate would
        # read "" , never match today, and self-heal a full retrain on EVERY
        # subsequent cycle -- the exact failure this marker exists to prevent.
        # So validate the shape and never write anything but a real ISO date.
        run: |
          ET_DATE="${{ steps.run_type.outputs.today_et }}"
          if ! printf '%s' "$ET_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            ET_DATE="$(TZ=America/New_York date +%Y-%m-%d 2>/dev/null || date -u +%Y-%m-%d)"
            echo "::error::run_type emitted no usable today_et — fell back to a locally computed '$ET_DATE'. The marker gate and this writer may now disagree; check the resolver."
          fi
          printf '%s\n' "$ET_DATE" > data/last_morning_run.txt
          echo "Marker written: $(cat data/last_morning_run.txt)"

      - name: Run stat-arb pairs scanner (morning weekly)
        if: steps.run_type.outputs.type == 'morning'
        run: python stat_arb.py || echo "Stat-arb non-fatal error — continuing"

      - name: Run stat-arb SHADOW book (morning, Frame 3 measurement-only)
        # Consumes the scanner's data/stat_arb/signals.json + pairs.json (written by
        # the step above) and advances a forward-only PAPER book → marks to market,
        # applies entries/exits (reversion / z>3.5 blowout / 3x-half-life time stop /
        # de-cointegration), charges 5 bps/leg, appends the book's daily net return to
        # data/stat_arb/stat_arb_ls.csv (committed below via the data/stat_arb/
        # pathspec). SHADOW ONLY — places NO Alpaca orders, touches NO live-model
        # state; the Frame-3 analog of analyze_rank_ic.py. Non-fatal so a yfinance
        # hiccup never blocks the trading commit. Idempotent per date.
        if: steps.run_type.outputs.type == 'morning'
        run: python shadow_stat_arb.py || echo "shadow stat-arb non-fatal error — continuing"

      - name: Stat-arb gate scorecard (morning, measurement-only)
        # P2 of the Frame-3 plan (scoped 2026-06-29, built 2026-07-09): prints
        # beta-to-SPY / max-DD / Sharpe / %win for the shadow book with the
        # blind-committed gates (|beta|<0.2, max-DD>-15%, >=30-obs window);
        # Sharpe/%win report-only. Reads data/stat_arb/*.csv, writes nothing.
        if: steps.run_type.outputs.type == 'morning'
        run: python analyze_stat_arb.py || echo "stat-arb scorecard non-fatal error — continuing"

      - name: Run intraday model
        if: steps.run_type.outputs.type != 'evening'
        env:
          GH_ACTIONS: 'true'
          RUN_TYPE: ${{ steps.run_type.outputs.type }}
        run: python model_intraday.py || echo "Intraday model non-fatal error — continuing"

      - name: Frame-2 shadow harness (morning, measurement-only)
        # P0 (scoped 7/9 ledger ⑦, defaults LOCKED): logs the intraday model's
        # raw pre-blend scores from data/predictions/intraday_signals.json
        # (only rows whose "generated" stamp is today — a stale committed file
        # is never re-logged), matures them vs the realized next-session
        # open->close return, appends daily Spearman rank-IC (equities only)
        # to data/shadow_intraday/. Prints "armed" and exits 0 until the model
        # first trains (~Aug 2026). SHADOW ONLY — no orders, no live-model
        # state. Idempotent per date; non-fatal.
        if: steps.run_type.outputs.type == 'morning'
        run: python shadow_intraday.py || echo "shadow-intraday non-fatal error — continuing"

      - name: Frame-2 shadow L/S + gate scorecard (morning, measurement-only)
        # P1+P2 (defaults locked 7/9): derives the balanced-decile long-short
        # series (equities only, open->close, causal SPY-hedged overlay) from
        # the P0 harness's matured predictions and prints the blind gate
        # scorecard (rank-IC >= 0.03 t>=2, |beta|<0.2, max-DD>-15%, >=30 obs;
        # Sharpe/%win report-only). Rewrites only the derived
        # data/shadow_intraday/cross_sectional_ls.csv. Armed-notice until the
        # P0 clock has data. Non-fatal.
        if: steps.run_type.outputs.type == 'morning'
        run: python analyze_shadow_intraday.py || echo "frame2 scorecard non-fatal error — continuing"

      - name: Save model cache (morning only)
        if: steps.run_type.outputs.type == 'morning'
        uses: actions/cache@v4
        with:
          path: data/models/
          key: model-cache-${{ github.run_id }}

      - name: Compute cross-sectional rank-IC (morning, measurement-only)
        # Reads the model's per-name predicted confidence from predictions.csv and
        # recomputes forward returns from price history to produce the Stage-1 gate's
        # rank-IC series → data/shadow/rank_ic.csv (committed by the step below via
        # the data/shadow/ pathspec). Pure measurement: changes nothing the model
        # trades, does not depend on the broken predictions.csv scorer. Non-fatal so
        # a yfinance hiccup never blocks the trading commit.
        if: steps.run_type.outputs.type == 'morning'
        run: python analyze_rank_ic.py || echo "rank-IC analysis non-fatal error — continuing"

      - name: Compute cross-sectional rank-IC — v2 / rank_score (morning, measurement-only)
        # PARALLEL series (2026-08-05). Identical code, different score column.
        #
        # The legacy series above ranks on `confidence`, which Cell 13's ternary
        # execution gate overwrites to exactly 0.50 for every HOLD and SELL
        # BEFORE log_prediction records it. Measured over 2026-07-14..07-29:
        # 95.3-99.6% of the 279-name cross-section sits at one value, no name
        # ever scores below 0.5, and so the short decile contains ZERO
        # model-selected names on every single day — both legs fall out in file
        # order. `rank_score` is the same value captured before that gate.
        #
        # Run in parallel rather than as a replacement: the legacy series is
        # what the Stage-1 gate has always read, and switching outright would
        # restart the decision window a third time with nothing to compare
        # against. v2 writes to its own files and stays empty until the first
        # run that logs rank_score (the analyzer exits 0 on the missing column).
        if: steps.run_type.outputs.type == 'morning'
        env:
          QT_RANK_SCORE_COL: rank_score
          QT_RANK_SERIES_LABEL: v2 pre-gate conviction
          QT_RANK_IC_OUT: data/shadow/rank_ic_v2.csv
          QT_RANK_LS_OUT: data/shadow/cross_sectional_ls_v2.csv
        run: python analyze_rank_ic.py || echo "rank-IC v2 analysis non-fatal error — continuing"

      - name: Commit updated state files to master
        # MUST run BEFORE the orphan-data-branch step below. That step does
        # `git checkout -f "$GITHUB_REF_NAME"`, and `git checkout -f` force-resets
        # the working tree to master's HEAD — DISCARDING every uncommitted tracked
        # modification (shadow/, stat_arb/, paper_trades/, predictions/, weights/)
        # while leaving untracked new files (intraday_history/) alone. That is why,
        # from 2026-06-09 to 2026-06-16, every `Auto:` commit carried ONLY
        # intraday_history and the shadow/stat-arb evidence clock froze: the engines
        # wrote their files fine, but the data-branch dance wiped the tracked ones
        # before this commit step ever saw them. Committing here first puts those
        # changes safely in a real commit, so the later `checkout -f` is harmless.
        #
        # Only persist regenerated state on the live master branch. On a
        # feature-branch dispatch (e.g. a GPU test run on feat/maximize-model)
        # this step is skipped so test runs stay fully isolated from master and
        # never push state files there.
        if: github.ref_name == 'master'
        env:
          GIT_USER_EMAIL: 'quant-bot@github-actions'
          GIT_USER_NAME:  'Quant Terminal Bot'
        run: |
          git config user.email "$GIT_USER_EMAIL"
          git config user.name  "$GIT_USER_NAME"
          # COMMIT FIRST, then rebase, then push. Do NOT pull --rebase before staging:
          # --autostash stashes the *tracked* state modifications and the pop can
          # silently drop them (swallowed by `|| true`). Committing first puts every
          # change in a real commit that the subsequent rebase replays cleanly.
          # Stage state files — explicitly exclude docs/data.json (lives on data branch).
          # Add each path INDEPENDENTLY: `git add a b c` is atomic and aborts staging
          # ALL paths if any one pathspec doesn't match (e.g. data/models/intraday_model.pkl
          # never exists while the intraday model can't train), which silently staged
          # nothing → commit skipped. Looping isolates missing paths.
          for p in data/paper_trades/ data/predictions/ data/weights/ \
                   data/intraday_history/ data/models/intraday_model.pkl \
                   data/stat_arb/ data/shadow/ data/shadow_intraday/ \
                   data/last_morning_run.txt docs/index.html; do
            git add "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Auto: ${{ steps.run_type.outputs.type }} cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin master || git rebase --abort || true
            git push origin master || true
          fi

      - name: Push dashboard data to orphan data branch
        env:
          GIT_USER_EMAIL: 'quant-bot@github-actions'
          GIT_USER_NAME:  'Quant Terminal Bot'
        run: |
          git config user.email "$GIT_USER_EMAIL"
          git config user.name  "$GIT_USER_NAME"
          # Push docs/data.json to an orphan `data` branch that is force-replaced each
          # cycle. This single-commit branch never accumulates history, keeping master
          # clean and the repo well under GitHub's 1 GB limit.
          if [ -f docs/data.json ]; then
            git checkout --orphan data-tmp
            git reset
            git add -f docs/data.json
            git commit -m "data: ${{ steps.run_type.outputs.type }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin data-tmp:data --force
            # Return to the branch the run was dispatched on. Was hardcoded to
            # `master`, which fails on a feature-branch dispatch: the shallow
            # (fetch-depth:1) checkout has no local `master` ref, so the orphan
            # dance left HEAD detached and `git checkout master` errored out
            # (exit 1) after the data push had already succeeded. $GITHUB_REF_NAME
            # is the dispatched branch on master AND on feature branches.
            git checkout -f "$GITHUB_REF_NAME" || git checkout -f master
            git branch -D data-tmp || true
            echo "data.json pushed to data branch OK"
          else
            echo "docs/data.json not found — skipping data branch push"
          fi

      - name: Verify evidence-clock persistence (alarm only)
        # Belt-and-suspenders guard for the regression that froze the evidence clock
        # from 2026-06-09 to 2026-06-16: an `Auto:` morning commit must carry the
        # evidence/state files, not just intraday_history. This does NOT block the
        # run (continue-on-error) — it only surfaces a loud ::warning:: (and pings
        # Discord if configured) so a future persistence regression is caught the
        # same day instead of weeks later. Only meaningful on master morning commits.
        if: github.ref_name == 'master' && steps.run_type.outputs.type == 'morning'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          msg=""
          if git log -1 --pretty=%s | grep -q '^Auto:'; then
            stat="$(git show --stat --name-only --pretty=format: HEAD)"
            wants="data/shadow/ data/stat_arb/ data/predictions/"
            # Frame-2 clock is guarded only once it has actually started (the
            # harness is armed-but-idle until the intraday model first trains).
            [ -f data/shadow_intraday/predictions.csv ] && wants="$wants data/shadow_intraday/"
            for want in $wants; do
              echo "$stat" | grep -q "$want" || msg="${msg} ${want}"
            done
          else
            echo "HEAD is not an Auto commit (no state changes this run) — skipping guard."
            exit 0
          fi
          if [ -n "$msg" ]; then
            echo "::warning::Evidence clock may have stalled — latest Auto commit is missing:${msg}"
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              curl -s -H 'Content-Type: application/json' \
                -d "{\"content\":\"⚠️ Quant-Terminal: latest Auto commit missing evidence files:${msg}\"}" \
                "$DISCORD_WEBHOOK_URL" >/dev/null || true
            fi
          else
            echo "✅ Evidence files present in latest Auto commit (shadow/stat_arb/predictions)."
          fi

      - name: Upload cycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ steps.run_type.outputs.type }}-${{ github.run_number }}
          path: cycle_output.log
          retention-days: 60

      # ── FLAT INVARIANT GATE (2026-08-11) ───────────────────────────────────
      # `closed N` is not proof of flat. Once a wind-down run has submitted
      # closes, every later wind-down run must observe an empty book; Cell 13
      # records that observation in wind_down_state.json and pages Discord on
      # the spot. This step turns it into a RED RUN as well, so a breach cannot
      # be missed by anyone not watching Discord.
      #
      # Placement is deliberate and load-bearing:
      #   * AFTER "Commit updated state files" and the data-branch push, so
      #     failing here can never cost an evidence commit or stall a clock —
      #     the thing the 6/09-6/16 freeze taught us to protect.
      #   * LAST in the job, so a non-zero exit skips nothing downstream.
      #   * `breach` is recomputed every run and never latches, so the gate goes
      #     green again on its own once the book is actually flat.
      # The `notify_failure` job below fires on this too, which is intended.
      - name: Flat-invariant gate (fails the run if the book is not empty)
        if: always()
        run: |
          set -u
          f=data/predictions/wind_down_state.json
          if [ ! -f "$f" ]; then
            echo "No wind-down state file — invariant not armed. Nothing to check."
            exit 0
          fi
          python - <<'PY'
          import json, sys, pathlib
          s = json.loads(pathlib.Path("data/predictions/wind_down_state.json").read_text() or "{}")
          armed, breach = s.get("armed"), s.get("breach")
          book, still = s.get("last_seen_book"), s.get("still_open") or []
          print(f"armed={armed} breach={breach} last_seen_book={book} "
                f"last_closed={s.get('last_closed')} errors={s.get('last_errors')}")
          if not armed:
              print("Wind-down not armed yet — nothing to enforce."); sys.exit(0)
          if breach:
              drill = s.get("drill") or []
              tag = " [DRILL — synthetic, no order was ever placed]" if drill else ""
              print(f"::error::FLAT INVARIANT BREACHED{tag} — wind-down armed but "
                    f"{book} position(s) still open: {', '.join(still[:20])}")
              sys.exit(1)
          print(f"OK — armed and flat (book={book}).")
          PY

  # ── FAILURE ALERTING (added 2026-08-06) ─────────────────────────────────────
  # The INNER of two alarms; morning_watchdog.yml is the outer one and asserts
  # the outcome instead of the process. This job fires whenever `trade` fails,
  # which INCLUDES "The job was not acquired by Runner of type hosted" - the
  # job never runs a step but its result is still `failure`, so a step-level
  # `if: failure()` inside `trade` would NOT have caught it. That is exactly
  # the 2026-08-06 outage (six runs, ~15 min each, zero notifications), and it
  # is why this has to be a separate job rather than a final step.
  notify_failure:
    needs: trade
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Page Discord with the failure class
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          # Infra vs code needs OPPOSITE responses - re-dispatch, or read the
          # log. A job that never got a runner executed no steps, so step count
          # separates the two without parsing annotation text.
          n_steps=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
                      --jq '[.jobs[] | select(.name=="trade") | .steps[]?] | length' 2>/dev/null || echo "")
          n_steps=${n_steps:-0}

          if [ "$n_steps" -le 1 ]; then
            head="🟠 **Quant-Terminal: run failed with NO RUNNER**"
            body="The job was never acquired (${n_steps} steps executed). This is GitHub infrastructure, **not** a code fault — re-dispatch, do not debug. Six of these on 2026-08-06."
          else
            head="🔴 **Quant-Terminal: RUN FAILED**"
            body="The job executed ${n_steps} steps and then failed — this one is real. Read the log before the next cycle."
          fi

          echo "${head} :: ${body}"
          if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
            curl -s -H 'Content-Type: application/json' \
              -d "$(printf '{"content":"%s\n%s\nTrigger: `%s`\n%s"}' \
                     "$head" "$body" "${{ github.event_name }}" "$RUN_URL")" \
              "$DISCORD_WEBHOOK_URL" >/dev/null || true
          else
            echo "::warning::DISCORD_WEBHOOK_URL not set — alert not delivered."
          fi

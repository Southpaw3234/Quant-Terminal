name: Quant Terminal v25.1 — 24/7 Trading

on:
  schedule:
    # ── Morning full cycle: macro + train + signals + trade (9:35 AM ET) ──
    # GitHub's scheduler is best-effort and silently drops ticks, so fire
    # several redundant morning attempts (9:35 / 9:50 / 10:05 ET). The run-type
    # logic below makes the FIRST one that lands do the retrain (marker-gated);
    # any later duplicate downgrades to a cheap intraday refresh. One on-time
    # success is all that's needed — no PC / external trigger dependency.
    - cron: '35 13 * * 1-5'
    - cron: '50 13 * * 1-5'
    - cron: '05 14 * * 1-5'
    # ── Midday signal refresh: load cached models + re-signal (12:00 PM ET) ──
    - cron: '00 16 * * 1-5'
    # ── Intraday model refresh: 2-hour resolution (11:00 AM ET) ─────────────
    - cron: '00 15 * * 1-5'
    # ── Pre-close refresh: final signals before close (3:00 PM ET) ─────────
    - cron: '00 19 * * 1-5'
    # ── Close + scoring: score outcomes + self-learning (5:30 PM ET) ────────
    - cron: '30 21 * * 1-5'
    # ── Weekend scoring: score any matured predictions Saturday morning ──────
    - cron: '00 14 * * 6'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type override'
        required: false
        default: 'morning'
        type: choice
        options: [morning, intraday, evening, scoring]

permissions:
  contents: write

concurrency:
  group: quant-terminal
  cancel-in-progress: false   # never cancel a live trading run mid-flight

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pandas-ta (pandas 2 compat via no-deps)
        run: pip install --no-deps "pandas-ta==0.3.14b0" || true

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Determine run type from schedule
        id: run_type
        run: |
          MANUAL="${{ github.event.inputs.run_type }}"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DAY=$(date -u +%u)   # 1=Mon ... 6=Sat

          if [ -n "$MANUAL" ]; then
            TYPE="$MANUAL"
          elif [ "$HOUR" = "13" ] || [ "$HOUR" = "14" ]; then
            TYPE="morning"
          elif [ "$HOUR" = "16" ] || [ "$HOUR" = "17" ] || [ "$HOUR" = "18" ]; then
            TYPE="intraday"
          elif [ "$HOUR" = "19" ]; then
            TYPE="intraday"
          elif [ "$HOUR" = "21" ] || [ "$DAY" = "6" ]; then
            TYPE="evening"
          else
            TYPE="morning"
          fi

          # ── Self-healing morning retrain (scheduled weekday runs) ──────────
          # GitHub's `schedule` cron is best-effort and silently drops ticks, so
          # the single 9:35 ET morning trigger has missed for days (no retrain →
          # no signals all day). Strategy: fire several morning-window crons
          # (above) AND make the day's FIRST scheduled cycle do the retrain,
          # tracked by a committed data/last_morning_run.txt marker:
          #   • no morning recorded today  -> force morning (covers a dropped
          #     9:35 tick; a later intraday cycle will catch up if all morning
          #     ticks drop)
          #   • morning already done today -> a duplicate morning-window cron
          #     downgrades to a cheap intraday refresh (no wasteful 2nd retrain)
          # Manual dispatches are left exactly as requested (explicit intent).
          if [ -z "$MANUAL" ] && [ "$DAY" -le 5 ]; then
            LAST_MORNING=""
            [ -f data/last_morning_run.txt ] && LAST_MORNING="$(cat data/last_morning_run.txt | tr -d '[:space:]')"
            TODAY=$(date -u +%Y-%m-%d)
            if [ "$LAST_MORNING" != "$TODAY" ]; then
              echo "Self-heal: no morning retrain for $TODAY (last=$LAST_MORNING) — running morning."
              TYPE="morning"
            elif [ "$TYPE" = "morning" ]; then
              echo "Morning retrain already done for $TODAY — downgrading duplicate morning cron to intraday refresh."
              TYPE="intraday"
            fi
          fi

          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Run type: $TYPE (UTC hour=$HOUR day=$DAY)"

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: data/models/
          key: model-cache-${{ steps.run_type.outputs.type == 'morning' && github.run_id || 'latest' }}
          restore-keys: |
            model-cache-

      - name: Run trading cycle
        env:
          GH_ACTIONS: 'true'
          RUN_TYPE:              ${{ steps.run_type.outputs.type }}
          GDRIVE_RCLONE_CONF:    ${{ secrets.GDRIVE_RCLONE_CONF }}
          ALPACA_API_KEY:        ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:     ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:       'https://paper-api.alpaca.markets'
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          QUIVER_QUANT_KEY:      ${{ secrets.QUIVER_QUANT_KEY }}
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALPHAVANTAGE_API_KEY:  ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          GIT_USER_EMAIL:        'quant-bot@github-actions'
          GIT_USER_NAME:         'Quant Terminal Bot'
        run: python quant_runner.py

      - name: Record morning retrain marker
        if: steps.run_type.outputs.type == 'morning'
        run: date -u +%Y-%m-%d > data/last_morning_run.txt

      - name: Run stat-arb pairs scanner (morning weekly)
        if: steps.run_type.outputs.type == 'morning'
        run: python stat_arb.py || echo "Stat-arb non-fatal error — continuing"

      - name: Run intraday model
        if: steps.run_type.outputs.type != 'evening'
        env:
          GH_ACTIONS: 'true'
          RUN_TYPE: ${{ steps.run_type.outputs.type }}
        run: python model_intraday.py || echo "Intraday model non-fatal error — continuing"

      - name: Save model cache (morning only)
        if: steps.run_type.outputs.type == 'morning'
        uses: actions/cache@v4
        with:
          path: data/models/
          key: model-cache-${{ github.run_id }}

      - name: Push dashboard data to orphan data branch
        env:
          GIT_USER_EMAIL: 'quant-bot@github-actions'
          GIT_USER_NAME:  'Quant Terminal Bot'
        run: |
          git config user.email "$GIT_USER_EMAIL"
          git config user.name  "$GIT_USER_NAME"
          # Push docs/data.json to an orphan `data` branch that is force-replaced each
          # cycle. This single-commit branch never accumulates history, keeping master
          # clean and the repo well under GitHub's 1 GB limit.
          if [ -f docs/data.json ]; then
            git checkout --orphan data-tmp
            git reset
            git add -f docs/data.json
            git commit -m "data: ${{ steps.run_type.outputs.type }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin data-tmp:data --force
            git checkout -f master || git checkout --force master
            git branch -D data-tmp || true
            echo "data.json pushed to data branch OK"
          else
            echo "docs/data.json not found — skipping data branch push"
          fi

      - name: Commit updated state files to master
        env:
          GIT_USER_EMAIL: 'quant-bot@github-actions'
          GIT_USER_NAME:  'Quant Terminal Bot'
        run: |
          git config user.email "$GIT_USER_EMAIL"
          git config user.name  "$GIT_USER_NAME"
          # Stage state files — explicitly exclude docs/data.json (lives on data branch)
          git add data/paper_trades/ data/predictions/ data/weights/ data/intraday_history/ data/models/intraday_model.pkl data/stat_arb/ data/last_morning_run.txt docs/index.html || true
          # Stash any remaining unstaged changes to avoid rebase conflict
          git stash --include-untracked || true
          git pull --rebase origin master || true
          git stash pop || true
          git diff --cached --quiet || \
            git commit -m "Auto: ${{ steps.run_type.outputs.type }} cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin master || true

      - name: Upload cycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ steps.run_type.outputs.type }}-${{ github.run_number }}
          path: cycle_output.log
          retention-days: 60
